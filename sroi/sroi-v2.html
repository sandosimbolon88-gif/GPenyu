<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kalkulator SROI v2</title>
<style>
:root{
  --bg:#f6f7f5; --panel:#ffffff; --ink:#1d2421; --muted:#5d6863; --line:#dfe3e0; --soft:#eef2ef;
  --accent:#16695a; --accent-2:#0f4f44; --accent-soft:#e3f1ec;
  --warn:#9a5b00; --warn-soft:#fff4e0; --err:#b3261e; --err-soft:#fdecea; --info:#2f5d8a; --info-soft:#e9f1f9;
  --neg:#b3261e; --pos:#16695a; --contoh:#7a4b00;
  --r:10px; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
h2{font-size:1.25rem} h3{font-size:1.05rem} h4{font-size:.95rem}
p{margin:.3em 0 .8em}
a{color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.78rem}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.05rem;letter-spacing:.2px;white-space:nowrap}
.brand span{display:block;font-weight:400;font-size:.75rem;color:var(--muted)}
.prog{display:flex;gap:6px;align-items:center;flex:1;min-width:220px}
.prog select{flex:1;min-width:0;max-width:360px}
.badge{margin-left:auto;display:flex;gap:8px;align-items:center}
.ratio-pill{background:var(--accent);color:#fff;border-radius:999px;padding:4px 12px;font-weight:700;white-space:nowrap}
.ratio-pill.none{background:#9aa5a0}
.warn-pill{border-radius:999px;padding:3px 10px;font-size:.8rem;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.warn-pill.err{background:var(--err-soft);color:var(--err);border-color:#f3c4c0}
.warn-pill.warn{background:var(--warn-soft);color:var(--warn);border-color:#f0d9b0}
.warn-pill.ok{background:var(--accent-soft);color:var(--accent-2)}
.saved{font-size:.75rem;color:var(--muted);white-space:nowrap}
/* Tab bar terpisah dari header: di HP header ikut tergulung, tab tetap terlihat */
.tabbar{position:sticky;top:var(--toph,0px);z-index:19;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.top{box-shadow:none}
@media (max-width:560px){
  .top{position:static}
  .top-in{padding:8px 12px;gap:8px}
  .brand span{display:none}
  .badge{margin-left:0;flex-wrap:wrap}
  .saved{display:none}
}
.card,[data-oc],h3[id],.subcard{scroll-margin-top:calc(var(--stick,0px) + 12px)}
nav.tabs{max-width:1180px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 10px;cursor:pointer;color:var(--muted);white-space:nowrap;font-size:.9rem}
nav.tabs button.on{color:var(--accent-2);border-bottom-color:var(--accent);font-weight:600}
nav.tabs button .n{display:inline-block;background:var(--warn-soft);color:var(--warn);border-radius:999px;font-size:.7rem;padding:0 6px;margin-left:4px}
nav.tabs button .n.err{background:var(--err-soft);color:var(--err)}

main{max-width:1180px;margin:0 auto;padding:18px 16px 80px}
.banner{max-width:1180px;margin:10px auto 0;padding:0 16px}
.banner > div{border-radius:var(--r);padding:8px 12px;font-size:.88rem;margin-bottom:6px}
.b-contoh{background:#fff6e5;border:1px dashed #d9a441;color:var(--contoh)}
.b-err{background:var(--err-soft);color:var(--err)}
.b-info{background:var(--info-soft);color:var(--info)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.row{display:flex;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:820px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.span2{grid-column:span 2} .span3{grid-column:1/-1}
@media (max-width:560px){.span2{grid-column:auto}}

/* Fields */
.f label{display:flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;color:#38423e;margin-bottom:3px}
.f input[type=text],.f input:not([type]),.f select,.f textarea{width:100%;border:1px solid #cdd3cf;border-radius:8px;padding:7px 9px;background:#fff}
.f textarea{resize:vertical;min-height:38px}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid #9fd1c4;border-color:var(--accent)}
.f.bad input,.f.bad textarea{border-color:var(--err);background:var(--err-soft)}
.f .msg{font-size:.76rem;color:var(--err);margin-top:2px;min-height:0}
.f .hint{font-size:.76rem;color:var(--muted);margin-top:2px}
.unit{position:relative}
.unit input{padding-right:34px!important}
.unit::after{content:attr(data-unit);position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem;pointer-events:none}
.chk{display:flex;align-items:center;gap:8px;font-size:.9rem;cursor:pointer}

.btn{border:1px solid #c5ccc8;background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-2)}
button.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.btn.pri:hover{background:var(--accent-2);color:#fff}
button.btn.sm{padding:3px 9px;font-size:.82rem}
button.btn.del:hover{border-color:var(--err);color:var(--err)}
button.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.chips button{border:1px solid #cdd3cf;background:#fff;border-radius:999px;font-size:.74rem;padding:1px 8px;cursor:pointer}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.chips button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2)}

details.menu{position:relative}
details.menu summary{list-style:none;cursor:pointer}
details.menu summary::-webkit-details-marker{display:none}
details.menu .pop{position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;min-width:230px;z-index:30}
details.menu .pop button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:6px;cursor:pointer}
details.menu .pop button:hover{background:var(--soft)}
details.menu .pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* Tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
th{background:var(--soft);font-weight:600;font-size:.8rem;color:#38423e}
tr.tot td{font-weight:700;border-top:2px solid #aab5b0}
td.neg{color:var(--neg)}
.edit-table td{padding:4px}
.edit-table .f label{display:none}
.edit-table .f input,.edit-table .f select,.edit-table .f textarea{padding:5px 7px}

/* Outcome cards */
.oc{border-left:4px solid var(--accent)}
.oc.negatif{border-left-color:var(--neg)}
.oc.kual{border-left-color:#9aa5a0}
.yt .f .msg{max-width:220px}
.yt td.num{vertical-align:middle;font-size:.84rem}
.otab td.num .tiny{white-space:normal;min-width:150px;text-align:right}
.otab td:nth-child(3){min-width:200px}
.otab td:nth-child(2){min-width:120px}
.oc-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.oc-h .t{flex:1;min-width:0}
.oc-h .t b{display:block}
.oc-h .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.oc.collapsed .oc-body{display:none}
.sec{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.sec > h4{font-size:.82rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px}
.filt{display:grid;grid-template-columns:minmax(200px,250px) 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--soft)}
.filt:last-child{border-bottom:0}
@media (max-width:640px){.filt{grid-template-columns:1fr}}
.live{background:var(--accent-soft);border-radius:8px;padding:8px 10px;font-size:.85rem;margin-top:10px}
.live.negatif{background:var(--err-soft)}
.live .flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.live .flow span.a{color:var(--muted)}
.ocw{margin-top:8px}

/* Results */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}

.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .l{font-size:.78rem;color:var(--muted)}
.kpi .v{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
.kpi.big{background:var(--accent);color:#fff;border-color:var(--accent)}
.kpi.big .l{color:#d3ece5}
.kpi.big .v{font-size:1.9rem}
.bars .b{display:grid;grid-template-columns:minmax(120px,32%) 1fr 92px;gap:8px;align-items:center;font-size:.84rem;margin:5px 0}
.bars .track{background:var(--soft);border-radius:4px;height:14px;position:relative;overflow:hidden}
.bars .fill{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bars .fill.neg{background:var(--neg)}
.tor .b{grid-template-columns:minmax(140px,28%) 1fr 150px}
.tor .track{height:16px;background:transparent;border-left:0}
.tor .base{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.tor .one{position:absolute;top:-3px;bottom:-3px;width:0;border-left:2px dashed var(--err)}
.tor .rng{position:absolute;top:2px;bottom:2px;background:#9fd1c4;border-radius:3px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.wl{list-style:none;padding:0;margin:0}
.wl li{padding:6px 10px;border-radius:8px;margin-bottom:5px;font-size:.86rem;display:flex;gap:8px;align-items:flex-start}
.wl li.err{background:var(--err-soft);color:var(--err)}
.wl li.warn{background:var(--warn-soft);color:#6f4300}
.wl li.info{background:var(--info-soft);color:var(--info)}
.wl li .go{margin-left:auto;flex:none}
.formula{background:#fbfcfb;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.86rem}
.formula code{background:var(--soft);padding:1px 5px;border-radius:4px;font-size:.84rem}
.scen{display:grid;grid-template-columns:minmax(150px,220px) 1fr 70px;gap:10px;align-items:center;margin:6px 0;font-size:.88rem}
.scen input[type=range]{width:100%;accent-color:var(--accent)}

/* ToC diagram */
.toc{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px;position:relative}
@media (max-width:900px){.toc{grid-template-columns:1fr;gap:10px}}
.toc .col h4{font-size:.74rem;text-transform:uppercase;letter-spacing:.5px;color:#fff;background:var(--accent);padding:5px 6px;border-radius:6px;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.toc .col h4 small{display:block;font-size:.66rem;font-weight:400;text-transform:none;letter-spacing:0;opacity:.85}
.toc .col:nth-child(4) h4,.toc .col:nth-child(5) h4{background:var(--accent-2)}
.toc .col:nth-child(6) h4{background:#0a3a32}
.toc-sdg{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:.84rem}
.sdgb{display:inline-block;background:var(--accent-soft);color:var(--accent-2);border:1px solid #b9dccf;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:600;white-space:normal;max-width:100%;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sdgb.utama{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Panel panduan "?" */
.q{border:1px solid #9fb3ab;background:#fff;color:var(--accent-2);width:19px;height:19px;border-radius:50%;font-size:.72rem;font-weight:700;line-height:17px;padding:0;cursor:pointer;flex:none;text-align:center}
.q:hover,.q[aria-expanded="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
th .q{margin-left:3px;vertical-align:1px}
.edit-table thead th{white-space:nowrap}
.hpop{position:absolute;z-index:60;width:min(380px,calc(100vw - 16px));max-height:70vh;overflow:auto;background:#fff;border:1px solid #c9d3cf;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:12px 14px;font-size:.86rem;line-height:1.45;color:var(--ink)}
.hpop.sheet{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;max-height:65vh;border-radius:14px 14px 0 0}
.hpop-h{display:flex;gap:8px;align-items:flex-start;margin-bottom:4px}
.hpop-h b{flex:1;font-size:.95rem}
.hpop-x{border:0;background:var(--soft);border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:1rem;line-height:1;flex:none}
.hpop h5{font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:10px 0 3px}
.hpop p{margin:.2em 0}
.hpop ul{margin:0;padding-left:1.1em}
.hpop li{margin:2px 0}
.hpop-ex{background:#fbfaee;border-left:3px solid #e2dca5;border-radius:0 6px 6px 0;padding:5px 9px}
.hpop code{background:var(--soft);padding:0 4px;border-radius:4px;font-size:.82rem}
/* Geser untuk mengubah urutan */
.grip{border:0;background:none;cursor:grab;color:#8a9691;font-size:1.05rem;line-height:1;padding:4px 3px;touch-action:none;border-radius:5px}
.grip:hover,.grip:focus-visible{color:var(--accent-2);background:var(--soft)}
.dragging{opacity:.55;outline:2px dashed var(--accent);outline-offset:2px;background:var(--accent-soft)!important}
body.is-dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
body.is-dragging .grip{cursor:grabbing}
.sorting .oc-body,.sorting .live,.sorting .ocw,.sorting .subcard .grid{display:none}
.sorting > [data-item]{margin-bottom:6px}
.toc .it{display:flex;gap:4px;align-items:flex-start}
.toc .it .grip{padding:0 2px;font-size:.9rem}
.toc .it span{flex:1;min-width:0;overflow-wrap:anywhere}
.toc .col[data-sort]{min-height:60px;border-radius:6px}
body.is-dragging .toc .col[data-sort]{background:var(--soft)}
td.gripcell{width:26px;padding-left:2px;padding-right:0;vertical-align:middle}

details.secopt > summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
details.secopt > summary::-webkit-details-marker{display:none}
details.secopt > summary h4{margin:0}
details.secopt > summary::before{content:"▸";color:var(--muted)}
details.secopt[open] > summary::before{content:"▾"}
/* Theory of Change: kotak, panah, editor, panduan */
.toc-wrap{position:relative}
.toc-arrows{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:0}
.toc-arrows path{fill:none;stroke:#a9bdb5;stroke-width:1.5}
.toc-arrows path.hl{stroke:var(--accent);stroke-width:2.6}
.toc-wrap .toc .col{z-index:1}
.toc .it{position:relative;z-index:1;flex-wrap:wrap}
.toc .it.hl{outline:2px solid var(--accent);outline-offset:1px}
.toc .it.card-node{border-color:#9fd1c4;background:#f3faf7}
.toc .it-t{flex:1;min-width:0;overflow-wrap:anywhere}
.it-ed{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 2px;font-size:.85rem;line-height:1}
.it-ed:hover{color:var(--accent-2)}
.it-ind{flex-basis:100%;font-size:.72rem;color:var(--info);margin-top:2px}
.it-to{flex-basis:100%;font-size:.72rem;color:var(--muted);margin-top:2px}
.has-arrows .it-to{display:none}
.has-arrows .toc .col:not(:last-child)::after{display:none}
.tm{display:inline-block;font-size:.66rem;border-radius:999px;padding:0 6px;background:var(--soft);color:var(--muted);white-space:nowrap;vertical-align:1px}
.tm-ok{background:var(--accent-soft);color:var(--accent-2)} .tm-neg{background:var(--err-soft);color:var(--err)} .tm-warn{background:var(--warn-soft);color:var(--warn)}
.tocadd{width:100%;border:1px dashed #b9c4bf;background:none;border-radius:6px;padding:4px;color:var(--muted);cursor:pointer;font-size:.8rem;margin-top:2px}
.tocadd:hover{border-color:var(--accent);color:var(--accent-2)}
.to-list{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:#fcfdfc}
.to-list .chk{font-size:.84rem;margin:3px 0;align-items:flex-start}
.tocpop textarea,.tocpop input[type=text]{width:100%;border:1px solid #cdd3cf;border-radius:8px;padding:6px 8px}
.tocpop .f label{display:flex;gap:6px;align-items:center;font-size:.8rem;font-weight:600;margin-bottom:3px}
.wiz{border:2px solid var(--accent)}
.wiz-bar{height:6px;background:var(--soft);border-radius:4px;margin:8px 0 10px;overflow:hidden}
.wiz-bar span{display:block;height:100%;background:var(--accent)}
.wiz-ta{width:100%;border:1px solid #cdd3cf;border-radius:8px;padding:7px 9px}
.wl-link{border-bottom:1px solid var(--soft);padding:6px 0}
@media print{ .toc-arrows{display:none} .it-to{display:block!important} }
/* Ikhtisar, tahap, status */
.hero{background:linear-gradient(180deg,#f3f9f6,#fff)}
.stage{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.stage-u{background:var(--warn-soft);color:var(--warn)} .stage-e{background:var(--accent-soft);color:var(--accent-2)}
.story{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
@media (max-width:900px){.story{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.story{grid-template-columns:1fr}}
.st-col{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:.86rem}
.st-col h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:4px}
.st-col ul{margin:0;padding-left:1.05em} .st-col li{margin:2px 0} .st-col .big{font-size:1.5rem;font-weight:700;margin:0;color:var(--accent-2)}
.st-col .neg{color:var(--neg)}
.st-col .sdgb{white-space:normal;max-width:100%;margin:0 0 4px}
.stb{display:inline-block;border-radius:999px;padding:0 7px;font-size:.7rem;font-weight:600;border:1px solid;vertical-align:1px;white-space:nowrap;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.stb-potensi{color:#6b6b6b;border-color:#c9c9c9;background:#f4f4f4}
.stb-proyeksi{color:var(--warn);border-color:#f0d9b0;background:var(--warn-soft)}
.stb-terukur{color:var(--info);border-color:#c8daec;background:var(--info-soft)}
.stb-terverifikasi{color:var(--accent-2);border-color:#b9dccf;background:var(--accent-soft)}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.step{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);border-left:4px solid #9aa5a0;border-radius:8px;background:#fff;padding:8px 10px;cursor:pointer}
.step:hover{border-color:var(--accent)} .step-n{font-weight:600} .step-s{font-size:.78rem;color:var(--muted)}
.step.st-ok{border-left-color:var(--accent)} .step.st-warn{border-left-color:#e0a63a} .step.st-err{border-left-color:var(--err)} .step.st-todo{border-left-color:#c5ccc8}
.tabpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 14px}
nav.tabs button.tab-set{margin-left:auto}
.wf .b{grid-template-columns:minmax(150px,38%) 1fr 92px}
.wf .fill.wf-tot{background:var(--accent)} .wf .fill.wf-neg{background:#e6a19c} .wf .fill.wf-pos{background:#9fd1c4}

/* How-to boxes & examples */
details.howto{background:var(--info-soft);border:1px solid #c8daec;border-radius:var(--r);padding:0;margin-bottom:14px}
details.howto > summary{cursor:pointer;padding:10px 14px;font-weight:700;color:var(--info);list-style:none;display:flex;gap:8px;align-items:center}
details.howto > summary::-webkit-details-marker{display:none}
details.howto > summary::before{content:"▸";transition:transform .15s}
details.howto[open] > summary::before{transform:rotate(90deg)}
details.howto > summary .tiny{font-weight:400;color:var(--muted);margin-left:auto}
@media (max-width:560px){details.howto > summary .tiny{display:none}}
.howto-b{padding:0 16px 12px;font-size:.88rem;color:#24384d}
.howto-b ol,.howto-b ul{margin:.3em 0 .6em 1.2em;padding:0}
.howto-b li{margin-bottom:3px}
.howto-b h4{font-size:.85rem;margin:.8em 0 .3em;color:var(--info)}
.howto-b table{background:#fff;font-size:.82rem;margin:4px 0 8px}
.exbox{background:#fff;border:1px dashed #b8cbe0;border-radius:8px;padding:7px 10px;margin:6px 0}
.exbox .good{color:var(--accent-2)} .exbox .bad{color:var(--err)}
.subcard{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;background:#fcfdfc}
.subcard-h{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.subcard-h b{flex:1}
.csv-levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:6px 0 10px}
@media (max-width:820px){.csv-levels{grid-template-columns:1fr}}
.csv-levels > div{background:#fff;border:1px solid #c8daec;border-radius:8px;padding:8px 10px;font-size:.82rem}
.toc .col{position:relative}
.toc .col:not(:last-child)::after{content:"→";position:absolute;right:-15px;top:2px;color:var(--muted);font-weight:700}
@media (max-width:900px){.toc .col:not(:last-child)::after{content:"↓";right:auto;left:50%;top:auto;bottom:-16px}}
.toc .it{background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:.82rem;margin-bottom:5px}
.toc-ctx{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:.85rem;margin-bottom:12px}

/* Checklist */
.pr{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--soft)}
.pr input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}

/* Guide */
.guide h3{margin-top:1.2em}
.guide dl dt{font-weight:700;margin-top:.7em}
.guide dl dd{margin:0 0 .6em 0}
.guide details.gd{border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:6px 0}
.guide details.gd summary{cursor:pointer}
.guide dd ul{margin:.2em 0 .3em 1.1em;padding:0}

.empty{padding:30px;text-align:center;color:var(--muted)}
.footer{color:var(--muted);font-size:.75rem;text-align:center;margin-top:30px}
.printonly{display:none}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2421;color:#fff;padding:8px 14px;border-radius:8px;font-size:.88rem;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

@media print{
  @page{size:A4;margin:14mm}
  html,body{background:#fff;font-size:11.5px}
  .top,.tabbar,.banner,.noprint,.toast,#hpop,#tocpop{display:none!important}
  main{padding:0;max-width:none}
  .card{box-shadow:none;break-inside:avoid;border-color:#ccc}
  .printonly{display:block}
  .pbreak{break-before:page}
  table{font-size:10px}
  .tw{overflow:visible}
  th,td{padding:4px 5px}
  .num{white-space:normal}
  table.otab{font-size:9px}
  table.otab th{font-size:8.5px}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .toc{grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
  .toc .col:not(:last-child)::after{content:"→";right:-10px;left:auto;top:2px;bottom:auto}
  .toc .it{font-size:9.5px;padding:3px 5px}
  .toc .col h4{font-size:8.5px}
  .kpi.big{background:#fff;color:var(--ink);border:2px solid var(--accent)}
  .kpi.big .l{color:var(--muted)}
  a{color:inherit;text-decoration:none}
}

<script>
(function(){
'use strict';

/* ================= Basics ================= */
const APP_VERSION = '2.2';
const SCHEMA = 5;
const LS_KEY = 'sroi-app-v2';
const LS_KEY_V1 = 'sroi-app-v1';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl2br = s => esc(s).replace(/\n/g,'<br>');
const short = (s,n=48) => { s = String(s||'').trim(); return s.length>n ? s.slice(0,n-1)+'…' : s; };
const isBlank = s => s==null || String(s).trim()==='';

/* ---- Number parsing: understands Indonesian format (3.600.000 / 3,5) and plain (3600000 / 3.5) ---- */
function parseNum(raw){
  if (raw==null) return {empty:true};
  let s = String(raw).trim().replace(/^rp\.?\s*/i,'').replace(/\s+/g,'').replace(/%$/,'');
  if (s==='') return {empty:true};
  let neg = false;
  if (s[0]==='-' || s[0]==='−'){ neg = true; s = s.slice(1); }
  if (!/^[\d.,]+$/.test(s) || !/\d/.test(s)) return {err:'Harus berupa angka (contoh: 3.600.000 atau 3,5)'};
  const dots = (s.match(/\./g)||[]).length, commas = (s.match(/,/g)||[]).length;
  let n;
  if (dots && commas){
    if (s.lastIndexOf(',') > s.lastIndexOf('.')){ // 3.600.000,50
      if (commas>1) return {err:'Format angka tidak jelas'};
      n = s.replace(/\./g,'').replace(',','.');
    } else { // 3,600,000.50
      if (dots>1) return {err:'Format angka tidak jelas'};
      n = s.replace(/,/g,'');
    }
  } else if (commas){
    if (commas>1){
      if (/^\d{1,3}(,\d{3})+$/.test(s)) n = s.replace(/,/g,'');
      else return {err:'Format angka tidak jelas'};
    } else n = s.replace(',','.');
  } else if (dots){
    if (/^\d{1,3}(\.\d{3})+$/.test(s)) n = s.replace(/\./g,'');     // 1.000 / 3.600.000 = ribuan
    else if (dots>1) return {err:'Format angka tidak jelas'};
    else n = s;                                                      // 3.5 = desimal
  } else n = s;
  const v = Number(n);
  if (!isFinite(v)) return {err:'Harus berupa angka'};
  return {value: neg ? -v : v};
}
/* ---- Rumus sederhana di kolom rupiah, seperti di Excel:
        30.928.000 × 28,1% × 15   ·   3.345.000.000 + 4.200.000.000   ·   17.646.640 / 2
        Operator: + − × * x / : ( ). Angka diakhiri % dibagi 100. ---- */
function evalExpr(raw){
  let s = String(raw ?? '').trim().replace(/^=/,'').replace(/rp\.?/gi,'').replace(/\s+/g,'');
  if (s==='') return {empty:true};
  const OPS = {'+':'+','-':'-','−':'-','*':'*','×':'*','x':'*','X':'*','/':'/','÷':'/',':':'/','(':'(',')':')'};
  const toks = []; let i = 0;
  while (i < s.length){
    const c = s[i];
    if (/[\d.,]/.test(c)){
      let j = i; while (j < s.length && /[\d.,]/.test(s[j])) j++;
      const t = s.slice(i,j), r = parseNum(t);
      if (r.err || r.empty) return {err:`Angka "${t}" tidak jelas`};
      let v = r.value; if (s[j]==='%'){ v /= 100; j++; }
      toks.push({n:v}); i = j; continue;
    }
    if (OPS[c]){ toks.push({o:OPS[c]}); i++; continue; }
    return {err:`Ada karakter yang tidak dikenali: "${c}"`};
  }
  let k = 0;
  const peek = () => toks[k], take = () => toks[k++];
  const prim = () => { const t = take(); if (!t) throw 0;
    if (t.n!=null) return t.n;
    if (t.o==='-') return -prim(); if (t.o==='+') return prim();
    if (t.o==='('){ const v = sum(); const c = take(); if (!c || c.o!==')') throw 0; return v; }
    throw 0; };
  const prod = () => { let v = prim(); while (peek() && (peek().o==='*' || peek().o==='/')){ const o = take().o, w = prim(); v = o==='*' ? v*w : v/w; } return v; };
  const sum = () => { let v = prod(); while (peek() && (peek().o==='+' || peek().o==='-')){ const o = take().o, w = prod(); v = o==='+' ? v+w : v-w; } return v; };
  try{
    const v = sum();
    if (k !== toks.length) return {err:'Rumus tidak lengkap atau salah tulis'};
    if (!isFinite(v)) return {err:'Hasil rumus tidak valid (pembagian dengan 0?)'};
    return {value:v, expr: toks.length>1};
  }catch(e){ return {err:'Rumus tidak lengkap atau salah tulis'}; }
}
const NUM = {
  nilai:{min:0,money:true,expr:true,label:'Nilai'},
  budgetAsk:{min:0,money:true,expr:true,label:'Dukungan yang diminta'},
  jumlah:{min:0,int:true,label:'Jumlah'},
  dw:{min:0,max:100,label:'Deadweight'},
  attr:{min:0,max:100,label:'Attribution'},
  disp:{min:0,max:100,label:'Displacement'},
  drop:{min:0,max:100,label:'Drop-off'},
  rate:{min:0,max:100,label:'Rate'},
  rateTetap:{min:0,max:100,label:'Rate tetap'},
  bulan:{min:0,max:12,label:'Bulan dihitung'},
  tahunAwal:{min:1990,max:2100,int:true,label:'Tahun awal'},
  tahunAkhir:{min:1990,max:2100,int:true,label:'Tahun akhir'},
  tahunAcuan:{min:1990,max:2100,int:true,label:'Tahun nilai saat ini'},
  dwPP:{min:0,max:100}, attrPP:{min:0,max:100}, dispPP:{min:0,max:100}, dropPP:{min:0,max:100},
  proxyPct:{min:0,max:100}, drLow:{min:0,max:100}, drHigh:{min:0,max:100}
};
function checkNum(field, raw){
  const spec = NUM[field]; if (!spec) return {ok:true};
  const r = spec.expr ? evalExpr(raw) : parseNum(raw);
  if (r.empty) return {empty:true};
  if (r.err) return {err:r.err};
  const v = r.value;
  if (v<0 || (spec.min!=null && v<spec.min)) return {err: spec.min>0 ? `Minimal ${spec.min}` : 'Tidak boleh negatif. Untuk outcome merugikan, centang "Outcome negatif".'};
  if (spec.max!=null && v>spec.max) return {err:`Maksimal ${spec.max}`};
  if (spec.int && Math.round(v)!==v) return {err:'Harus bilangan bulat'};
  return {value:v, expr:r.expr};
}
function val(raw, def){ const r = parseNum(raw); return (r.value!=null) ? r.value : def; }
function valE(raw, def){ const r = evalExpr(raw); return (r.value!=null) ? r.value : def; }

const fmtNum = (v,d=0) => (isFinite(v)?v:0).toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtRp = v => (v<0?'−':'') + 'Rp ' + fmtNum(Math.abs(v));
function fmtRpShort(v){
  const a = Math.abs(v), s = v<0?'−':'';
  if (a>=1e12) return s+'Rp '+fmtNum(a/1e12,2)+' T';
  if (a>=1e9) return s+'Rp '+fmtNum(a/1e9,2)+' M';
  if (a>=1e6) return s+'Rp '+fmtNum(a/1e6,1)+' jt';
  return s+'Rp '+fmtNum(a);
}
const fmtPct = (x,d) => { const p = x*100; return fmtNum(p, d!=null?d:(Math.abs(p-Math.round(p))<1e-9?0:1)) + '%'; };
const fmtRatio = v => (v==null||!isFinite(v)) ? '–' : fmtNum(v,2);
const fmtRate = x => fmtNum(x*100, 3).replace(/,?0+$/,'') + '%';
const fmtBln = v => (v==null||!isFinite(v)) ? '–' : fmtNum(v,1) + ' bln';
/* angka → teks yang bisa dibaca ulang parseNum (3.600.000 / 27,75) */
const numIn = v => { const r = Math.round(v*1e6)/1e6; const [a,b] = String(Math.abs(r)).split('.'); return (r<0?'-':'') + Number(a).toLocaleString('id-ID') + (b ? ','+b : ''); };
const today = () => { const d=new Date(); return d.toISOString().slice(0,10); };

/* ================= Help texts ================= */
const HELP = {
  nama:'Nama program yang dinilai. Satu program = satu analisis SROI.',
  jenis:'Evaluatif: menilai dampak yang sudah terjadi, pakai data nyata. Prakiraan (forecast): memperkirakan dampak program yang akan atau baru berjalan, biasanya dipakai waktu merancang program.',
  discountRate:'Rupiah tahun depan nilainya lebih kecil dari rupiah hari ini, jadi nilai tahun ke-2, ke-3 dan seterusnya dikecilkan. Panduan Cabinet Office UK (2012) memakai 3,5%. Ada juga praktik di Indonesia yang memakai BI Rate. Yang penting tulis alasannya dan konsisten antar laporan.',
  lingkup:'Batasan analisis: periode, wilayah, stakeholder dan outcome apa yang dimasukkan dan apa yang tidak, beserta alasannya.',
  sNama:'Pihak yang mengalami perubahan karena program, positif maupun negatif. Contoh: peserta, keluarga peserta, pengepul, pemerintah desa.',
  sLibat:'Cara stakeholder dilibatkan: wawancara, kuesioner, FGD. SROI wajib melibatkan stakeholder, bukan ditebak dari meja.',
  sMaterial:'Material = perubahannya cukup penting dan cukup besar untuk dihitung. Kalau tidak dihitung, tulis alasannya di kolom sebelahnya.',
  iUraian:'Semua yang dikeluarkan untuk program. Bukan cuma uang: waktu relawan atau barang sumbangan juga bisa dinilai. Total input jadi pembagi (penyebut) rasio SROI.',
  output:'Apa yang dihasilkan program. Bentuknya kegiatan atau jumlah yang dijangkau, belum berupa perubahan. Contoh: "50 ibu dilatih".',
  outcome:'Perubahan yang dialami stakeholder. Ini yang dinilai. "Dilatih" itu output, "penghasilannya naik" itu outcome.',
  indikator:'Cara membuktikan outcome benar-benar terjadi. Contoh: rata-rata penghasilan tambahan per bulan dari catatan setoran.',
  sumberData:'Dari mana angka quantity dan indikator diambil: kuesioner, data program, catatan lapangan, laporan mitra.',
  negatif:'Centang kalau ini perubahan yang merugikan (misalnya beban kerja bertambah). Nilainya akan mengurangi total manfaat.',
  qty:'Berapa orang atau unit yang benar-benar mengalami outcome. Bukan jumlah peserta, tapi yang berubah. Contoh: 40 dari 50 yang aktif setor.',
  proxyNilai:'Nilai rupiah untuk 1 unit outcome selama 1 tahun. Kalau outcome-nya penghasilan, langsung pakai datanya. Kalau tidak ada harga pasar (misalnya rasa percaya diri), pakai pembanding: biaya pengganti atau harga layanan serupa.',

/* path -> object. oy:<outcomeId>:<tahun>:<field>, y:<tahun>:<field>, st:<siteId>:<field> */
function resolve(path, create){
  const [k,a,b,c] = path.split(':'); const p = cur();
  if (k==='p') return [p, a];
  if (k==='s') return [p.stakeholders.find(x=>x.id===a), b];
  if (k==='i') return [p.inputs.find(x=>x.id===a), b];
  if (k==='o') return [p.outcomes.find(x=>x.id===a), b];
  if (k==='oy'){ const o = p.outcomes.find(x=>x.id===a); if (!o) return [null,null];
    if (!o.years[b]){ if (!create) return [{}, c]; o.years[b] = {nilai:'', dw:'', attr:'', disp:'', drop:''}; }
    return [o.years[b], c]; }
  if (k==='y'){ if (!p.years[a]){ if (!create) return [{}, b]; p.years[a] = {rate:'', bulan:'12'}; } return [p.years[a], b]; }
  if (k==='st') return [p.sites.find(x=>x.id===a), b];
  if (k==='rv') return [p.review, a];
  if (k==='dp') return [p.display, a];
  if (k==='ti') return [p.toc.items.find(x=>x.id===a), b];
  if (k==='r') return [p.regulasi.find(x=>x.id===a), b];
  if (k==='g') return [p.sdgs.find(x=>x.id===a), b];
  if (k==='u') return [p.units.find(x=>x.id===a), b];
  if (k==='toc') return [p.toc, a];
  if (k==='ck') return [p.checklist[+a], b];

}
function getPath(path){ const [o,f] = resolve(path, false); return o ? (o[f] ?? '') : ''; }
function setPath(path, v){ const [o,f] = resolve(path, true); if (o) o[f] = v; }
const fieldOf = path => path.split(':').pop();

/* ================= Calculation =================
   Mengikuti worksheet konsultan:
   1. Nilai bersih tahun t = nilai kotor_t × (1 − DW_t) × (1 − Attr_t) × (1 − Disp_t) × (1 − DO_t)
   2. Nilai saat ini = nilai_t × (1 + r)^(tahun acuan − t)   (dipakai untuk manfaat dan investasi)
      r = rata-rata rate per tahun (mis. BI Rate) atau satu rate tetap
   3. SROI = Σ manfaat saat ini ÷ Σ investasi saat ini   (per tahun dan total)
   4. Payback (bulan) = investasi saat ini ÷ (manfaat saat ini ÷ jumlah bulan periode) */
function yearsOf(p){
  let a = Math.round(val(p.tahunAwal, NaN)), b = Math.round(val(p.tahunAkhir, NaN));
  if (!isFinite(a)) a = THIS_YEAR; if (!isFinite(b) || b < a) b = a; if (b - a > 29) b = a + 29;
  const ys = []; for (let y=a; y<=b; y++) ys.push(y); return ys;
}
function rateOf(p){
  const rs = yearsOf(p).map(y=>(p.years[y]||{}).rate).filter(x=>!isBlank(x)).map(x=>val(x,0));
  return rs.length ? rs.reduce((s,x)=>s+x,0)/rs.length/100 : 0;
}
function refYearOf(p){ const ys = yearsOf(p); return p.jenis==='prakiraan' ? ys[0] : ys[ys.length-1]; }
const bulanOf = (p,y) => { const b = (p.years[y]||{}).bulan; return isBlank(b) ? 12 : Math.max(0, val(b,12)); };
const isPem = (o, p) => { const s = (p||cur()).stakeholders.find(x=>x.id===o.stakeholderId); return !!(s && s.jenis==='pemrakarsa'); };
function compute(p, ov){
  ov = ov || {};
  const ys = yearsOf(p), ref = refYearOf(p);
  const r = ov.r!=null ? ov.r/100 : rateOf(p);
  const fac = y => Math.pow(1+r, ref - y);
  const clamp = x => Math.min(1, Math.max(0, x));
  const Yr = {}; ys.forEach(y=>Yr[y] = {y, f:fac(y), bulan:bulanOf(p,y), inp:0, inpPV:0, gross:0, net:0, pv:0, pvPem:0});
  let outInput = 0;
  for (const i of p.inputs){
    if (ov.site!==undefined && (i.siteId||'')!==ov.site) continue;
    const v = Math.max(0, valE(i.nilai,0)), y = Math.round(val(i.tahun, ys[0]));
    if (!Yr[y]){ outInput += v; continue; }
    Yr[y].inp += v; Yr[y].inpPV += v*Yr[y].f;
  }
  const rows = [], excluded = [];
  const cuts = {gross:0, dw:0, at:0, di:0, dr:0, net:0, negNet:0};
  for (const o of p.outcomes){
    if (ov.exclude === o.id) continue;
    const sk = p.stakeholders.find(x=>x.id===o.stakeholderId);
    if (sk && sk.material==='tidak'){ excluded.push(o); continue; }
    if (ov.site!==undefined && (o.siteId||'')!==ov.site) continue;
    const pem = isPem(o, p);
    if (ov.noPem && pem) continue;
    const sign = o.negatif ? -1 : 1;
    const yrs = []; let g = 0, n = 0, pv = 0;
    for (const y of ys){
      const d = (o.years||{})[y] || {};
      if (o.kualitatif || isBlank(d.nilai)){ yrs.push({y, empty:true, gross:0, net:0, pv:0, dw:0, at:0, di:0, dr:0}); continue; }
      const gross = Math.max(0, valE(d.nilai,0)) * (1 + (ov.proxyPct||0)/100);
      const dw = clamp(val(d.dw,0)/100 + (ov.dwAdd||0)/100), at = clamp(val(d.attr,0)/100 + (ov.attrAdd||0)/100);
      const di = clamp(val(d.disp,0)/100 + (ov.dispAdd||0)/100), dr = clamp(val(d.drop,0)/100 + (ov.dropAdd||0)/100);
      const net = sign * gross * (1-dw) * (1-at) * (1-di) * (1-dr), pvy = net * Yr[y].f;
      if (sign>0){ const c1 = gross*dw, v1 = gross-c1, c2 = v1*at, v2 = v1-c2, c3 = v2*di, v3 = v2-c3, c4 = v3*dr;
        cuts.gross += gross; cuts.dw += c1; cuts.at += c2; cuts.di += c3; cuts.dr += c4; cuts.net += net; } else cuts.negNet += net;
      yrs.push({y, gross:sign*gross, dw, at, di, dr, net, pv:pvy});
      g += sign*gross; n += net; pv += pvy;
      Yr[y].gross += sign*gross; Yr[y].net += net; Yr[y].pv += pvy; if (pem) Yr[y].pvPem += pvy;
    }
    rows.push({o, pem, sign, years:yrs, gross:g, net:n, pv});
  }
  const byYear = ys.map(y=>{ const t = Yr[y];
    return Object.assign(t, {sroi: t.inpPV>0 ? t.pv/t.inpPV : null, payback: (t.pv>0 && t.inpPV>0 && t.bulan>0) ? t.inpPV/(t.pv/t.bulan) : null}); });
  const sum = k => byYear.reduce((s,t)=>s+t[k],0);
  const totalInput = sum('inp'), totalInputPV = sum('inpPV'), totalGross = sum('gross'), totalNet = sum('net'), totalPV = sum('pv'), pvPem = sum('pvPem'), months = sum('bulan');
  const pos = rows.filter(x=>x.sign>0);
  const gPos = pos.reduce((s,x)=>s+x.gross,0), nPos = pos.reduce((s,x)=>s+x.net,0);
  const sroi = totalInputPV>0 ? totalPV/totalInputPV : null;
  return {ys, ref, r, rows, byYear, totalInput, totalInputPV, totalGross, totalNet, totalPV, pvPem, months, outInput, excluded, cuts,
    sroi, sroiNoPem: (pvPem && totalInputPV>0) ? (totalPV-pvPem)/totalInputPV : null,
    npv: totalPV - totalInputPV, fiksasi: gPos>0 ? 1 - nPos/gPos : 0,
    payback: (totalPV>0 && totalInputPV>0 && months>0) ? totalInputPV/(totalPV/months) : null};
}
function solveOne(f, lo, hi){
  const g = x => { const v = f(x); return v==null ? NaN : v - 1; };
  let a = lo, b = hi, fa = g(a), fb = g(b);
  if (!isFinite(fa) || !isFinite(fb) || fa*fb > 0) return null;
  for (let i=0;i<70;i++){
    const m = (a+b)/2, fm = g(m);
    if (fa*fm <= 0){ b = m; fb = fm; } else { a = m; fa = fm; }
  }
  return (a+b)/2;
}

  ['tahunAwal','tahunAkhir'].forEach(k=>{ const c = checkNum(k, p[k]); if (c.err) add('err','program',`${NUM[k].label} — ${c.err}`); });
  if (val(p.tahunAkhir,0) < val(p.tahunAwal,0)) add('err','program','Tahun akhir lebih kecil dari tahun awal.');
  if (val(p.tahunAkhir,0) - val(p.tahunAwal,0) > 29) add('warn','program','Periode lebih dari 30 tahun; hanya 30 tahun pertama yang dihitung.');
  ys.forEach(y=>{ const d = p.years[y]||{}; if (isBlank(d.rate)) add('warn','program',`Rate (BI Rate) tahun ${y} belum diisi; rata-rata hanya dari tahun yang terisi.`); else { const c = checkNum('rate', d.rate); if (c.err) add('err','program',`Rate tahun ${y} — ${c.err}`); } });
  ys.forEach(y=>{ const d = p.years[y]||{}; const c = checkNum('bulan', d.bulan); if (c.err) add('err','program',`Bulan dihitung tahun ${y} — ${c.err}`); });
  if (isBlank(p.rateAlasan)) add('info','program','Alasan/sumber rate belum ditulis.');
  p.inputs.forEach((i,idx)=>{
    const c = checkNum('nilai', i.nilai); if (c.err) add('err','input',`Input ${idx+1}: nilai — ${c.err}`);
    const y = Math.round(val(i.tahun, NaN));
    if (isBlank(i.tahun)) add('warn','input',`Input ${idx+1}: tahun belum dipilih (dianggap ${ys[0]}).`);
    else if (!ys.includes(y)) add('err','input',`Input ${idx+1}: tahun ${i.tahun} di luar periode analisis, jadi tidak dihitung.`);
  });
  p.stakeholders.forEach((s,idx)=>{ const c = checkNum('jumlah', s.jumlah); if (c.err) add('err','stakeholder',`Stakeholder ${idx+1}: jumlah — ${c.err}`); });
  if (!p.inputs.length || res.totalInput<=0) add('err','input','Total investasi masih 0, jadi rasio SROI belum bisa dihitung.');
  if (!p.outcomes.length) add('err','outcome','Belum ada outcome yang dinilai.');
  p.outcomes.forEach((o,idx)=>{
    const n = `Outcome ${idx+1}${o.outcome ? ' ('+short(o.outcome,40)+')' : ''}`;
    if (!o.stakeholderId || !findS(o.stakeholderId)) add('warn','outcome',`${n}: stakeholder belum dipilih.`, o.id);
    if (isBlank(o.outcome)) add('warn','outcome',`${n}: deskripsi outcome masih kosong.`, o.id);
    if (isBlank(o.indikator)) add('warn','outcome',`${n}: indikator belum diisi.`, o.id);
    if (isBlank(o.aspek)) add('info','outcome',`${n}: aspek belum dipilih.`, o.id);
    if (o.kualitatif) return;
    const filled = ys.filter(y=>!isBlank(((o.years||{})[y]||{}).nilai));
    Object.keys(o.years||{}).forEach(y=>{ if (!ys.includes(+y) && !isBlank(o.years[y].nilai)) add('warn','outcome',`${n}: ada nilai di tahun ${y} yang di luar periode, tidak dihitung.`, o.id); });
    ys.forEach(y=>{ const d = (o.years||{})[y]||{};
      ['nilai','dw','attr','disp','drop'].forEach(f=>{ const c = checkNum(f, d[f]); if (c.err) add('err','outcome',`${n}, ${y}: ${NUM[f].label==='Nilai'?'nilai manfaat':NUM[f].label} — ${c.err}`, o.id); }); });
    if (!filled.length){ add('warn','outcome',`${n}: nilai manfaat belum diisi di tahun mana pun. Kalau memang tidak dirupiahkan, centang "Outcome kualitatif".`, o.id); return; }
    if (isBlank(o.metode)) add('info','outcome',`${n}: metode valuasi belum dipilih.`, o.id);
    if (isBlank(o.deskripsi)) add('warn','outcome',`${n}: deskripsi valuasi kosong. Tulis cara hitung supaya bisa dicek ulang.`, o.id);
    if (isBlank(o.proxySumber)) add('warn','outcome',`${n}: sumber/referensi proxy kosong. Tanpa sumber, nilai ini sulit dipertahankan saat direview.`, o.id);
    FILTERS.forEach(F=>{
      const ysF = F.k==='drop' ? filled.slice(1) : filled;
      const blank = ysF.filter(y=>isBlank(o.years[y][F.k]));
      if (blank.length) add('warn','outcome',`${n}: ${F.lab} ${blank.join(', ')} belum diisi (dianggap 0%).`, o.id);
      if (ysF.some(y=>val(o.years[y][F.k],0)>0) && isBlank(o[F.k+'Alasan'])) add('warn','outcome',`${n}: ${F.lab} diisi tapi penjelasannya kosong.`, o.id);
    });
    if (filled.length>1 && filled.slice(1).every(y=>val(o.years[y].drop,0)===0) && filled.slice(1).some(y=>!isBlank(o.years[y].drop)))
      add('info','outcome',`${n}: dihitung ${filled.length} tahun tanpa drop-off. Artinya dampak tidak memudar sama sekali; pastikan ada dasarnya.`, o.id);
    if (o.metode==='cash_transfer' && filled.every(y=>FILTERS.every(F=>val(o.years[y][F.k],0)===0)))
      add('info','outcome',`${n}: cash transfer dengan semua fiksasi 0%. Nilainya sama dengan uang yang diberikan, jadi komponen ini hanya "mengembalikan" input (rasio ≈ 1). Pastikan ini disengaja.`, o.id);
  });
  if (res.pvPem) add('info','hasil',`Rasio memasukkan manfaat pemrakarsa (perusahaan) ${fmtRpShort(res.pvPem)}. Tanpa itu, SROI = 1 : ${fmtRatio(res.sroiNoPem)}.`);
  if (res.outInput) add('err','input',`Ada investasi ${fmtRp(res.outInput)} dengan tahun di luar periode; tidak dihitung.`);
  if (res.sroi!=null && res.sroi>10) add('warn','hasil',`Rasio ${fmtRatio(res.sroi)} di atas 10. Belum tentu salah, tapi cek ulang proxy dan fiksasi dampak.`);
  if (res.sroi!=null && res.sroi<0) add('warn','hasil','Rasio negatif: outcome negatif lebih besar dari outcome positif.');
  res.byYear.forEach(t=>{ if (t.inp>0 && t.sroi!=null && t.sroi<1) add('info','hasil',`SROI tahun ${t.y} = 1 : ${fmtRatio(t.sroi)} (di bawah 1). Wajar untuk tahun pertama kalau manfaat baru terasa belakangan.`); });
  p.stakeholders.forEach((s,idx)=>{
    const nm = s.nama || `Stakeholder ${idx+1}`;
    if (s.material==='ya' && !p.outcomes.some(o=>o.stakeholderId===s.id)) add('warn','stakeholder',`${nm}: ditandai material tapi belum punya outcome.`);
    if (s.material==='tidak' && isBlank(s.alasanMaterial)) add('warn','stakeholder',`${nm}: tidak dihitung, tapi alasannya belum ditulis.`);
    if (isBlank(s.libat)) add('info','stakeholder',`${nm}: cara dilibatkan belum dicatat.`);
  });
  if (!p.stakeholders.length) add('warn','stakeholder','Belum ada stakeholder.');
  if (p.outcomes.length && !p.outcomes.some(o=>o.negatif)) add('info','outcome','Belum ada outcome negatif. Kalau memang tidak ada, catat di lingkup analisis.');
  // Theory of Change & keselarasan (dokumentasi, tidak memengaruhi rasio)
  tocChecks(p, add);
  const us = tahapOf(p)==='usulan';
  if (isBlank(p.tujuan)) add('info','program','Tujuan terukur belum ditulis.');
  if (us && isBlank(p.budgetAsk)) add('info','program','Dukungan yang diminta dari mitra belum diisi.');
  if (isBlank(p.keberlanjutan)) add('info','program','Rencana keberlanjutan setelah pendanaan belum ditulis.');
  { const c = checkNum('budgetAsk', p.budgetAsk); if (c.err) add('err','program',`Dukungan yang diminta — ${c.err}`); }
  (res.excluded||[]).forEach(o=>add('info','outcome',`Outcome "${short(o.outcome||'tanpa nama',40)}" tidak masuk total karena stakeholder-nya ditandai tidak dihitung.`, o.id));
  p.outcomes.forEach((o,idx)=>{ const n = `Outcome ${idx+1}${o.outcome ? ' ('+short(o.outcome,40)+')' : ''}`;
    if (isBlank(o.target) && isBlank(o.realisasi)) add('info','outcome',`${n}: target belum diisi.`, o.id);
    if (!us && isBlank(o.realisasi)) add('info','outcome',`${n}: realisasi belum diisi.`, o.id);
    if (!us && o.status==='proyeksi' && !o.kualitatif) add('warn','outcome',`${n}: status bukti masih "proyeksi". Perbarui ke "terukur" kalau sudah ada data.`, o.id); });
  p.units.forEach(u=>{ if (isBlank(u.nama)) return;
    if (['terukur','terverifikasi'].includes(u.statusBukti) && isBlank(u.bukti)) add('warn','selaras',`Unit ${u.nama}: status "${u.statusBukti}" perlu diisi realisasi & buktinya.`);
    if (u.jenis==='bisnis' && !u.outcomeId) add('info','selaras',`Unit ${u.nama}: hubungkan dengan outcome sosial supaya klaim shared value jelas.`); });
  if (!us && isBlank(p.review.nama)) add('info','checklist','Catatan review (siapa yang memeriksa) belum diisi.');
  if (!p.regulasi.length) add('info','selaras','Belum ada regulasi terkait yang dicatat.');
  p.regulasi.forEach((r,idx)=>{ if (!isBlank(r.nama) && isBlank(r.kaitan)) add('info','selaras',`Regulasi ${idx+1}: kaitan dengan program belum dijelaskan.`); });
  const goals = p.sdgs.filter(g=>g.goal);
  if (!goals.length) add('info','selaras','Belum ada SDGs yang dipilih.');
  else {
    if (!goals.some(g=>g.peran==='utama')) add('info','selaras','SDGs: belum ada tujuan yang ditandai "utama".');
    const uniq = new Set(goals.map(g=>g.goal)).size;
    if (uniq>5) add('warn','selaras',`SDGs: ${uniq} tujuan dipilih. Terlalu banyak tujuan melemahkan klaim; fokus ke 1–2 utama dan beberapa pendukung.`);
    goals.forEach(g=>{ if (isBlank(g.target) || isBlank(g.kontribusi)) add('info','selaras',`SDG ${g.goal}: target atau kontribusinya belum diisi.`); });
  }
  p.units.forEach(u=>{ if (!isBlank(u.nama) && isBlank(u.manfaat) && isBlank(u.peran)) add('info','selaras',`Unit ${u.nama}: peran dan manfaat belum diisi.`); });
  const done = p.checklist.filter(c=>c.done).length;
  if (done < PRINCIPLES.length) add('info','checklist',`Checklist prinsip SROI: ${done} dari ${PRINCIPLES.length} sudah dicentang.`);
  return W;
}

function fld(o){
  // o: {label, path, help, type:'text'|'textarea'|'select'|'num', unit, options, ph, rows, cls, list}
  const v = getPath(o.path) ?? '';
  const f = fieldOf(o.path);
  let ctrl, state = '', msg = '', hint = '';
  if (o.type==='textarea'){
    ctrl = `<textarea data-path="${o.path}" rows="${o.rows||2}" placeholder="${esc(o.ph||'')}" aria-label="${esc(o.label||'')}">${esc(v)}</textarea>`;
  } else if (o.type==='select'){
    ctrl = `<select data-path="${o.path}" aria-label="${esc(o.label||'')}">${o.options.map(([k,l])=>`<option value="${esc(k)}"${String(k)===String(v)?' selected':''}>${esc(l)}</option>`).join('')}</select>`;
  } else {
    ctrl = `<input type="text" ${o.type==='num'?'inputmode="decimal" autocomplete="off"':''}${o.list?` list="${o.list}" autocomplete="off"`:''} data-path="${o.path}" value="${esc(v)}" placeholder="${esc(o.ph||'')}" aria-label="${esc(o.label||'')}">`;
    if (o.unit) ctrl = `<div class="unit" data-unit="${esc(o.unit)}">${ctrl}</div>`;
    if (o.type==='num'){
      const c = checkNum(f, v);
      if (c.err){ state = ' bad'; msg = esc(c.err); }
      else if (NUM[f] && NUM[f].money && c.value!=null) hint = '= ' + fmtRp(c.value) + (c.expr ? ' (hasil rumus)' : '');
    }
  }
  const hk = o.help || guideKey(o.path);
  return `<div class="f${state}${o.cls?' '+o.cls:''}" data-f="${o.path}">
    ${o.label!=null ? `<label>${esc(o.label)} ${qBtn(hk, o.label)}</label>` : ''}
    ${ctrl}
    ${o.type==='num' ? `<div class="msg">${msg}</div><div class="hint">${hint}</div>` : ''}
  </div>`;
}

function stickyH(){ const t = document.querySelector('.top'), n = document.querySelector('.tabbar'); let h = 0;
  [t,n].forEach(el=>{ if (el && getComputedStyle(el).position==='sticky') h = Math.max(h, el.getBoundingClientRect().bottom); }); return Math.max(0, h); }

  document.documentElement.style.setProperty('--toph', h + 'px'); document.documentElement.style.setProperty('--stick', (stickyH() || 0) + 'px'); }

/* ---- Geser untuk mengubah urutan (mouse, sentuh, dan panah atas/bawah di tombol ⠿) ---- */
const SORT_LISTS = {stk:p=>p.stakeholders, inp:p=>p.inputs, out:p=>p.outcomes, site:p=>p.sites, reg:p=>p.regulasi, sdg:p=>p.sdgs, unit:p=>p.units};
const grip = (label) => `<button type="button" class="grip" data-grip title="Geser untuk mengubah urutan (atau tekan ↑/↓)" aria-label="Geser ${esc(label||'')} untuk mengubah urutan">⠿</button>`;
let drag = null;
const sortItems = box => [...box.children].filter(x=>x.hasAttribute('data-item'));
document.addEventListener('pointerdown', e=>{
  const g = e.target.closest('[data-grip]'); if (!g || e.button>0) return;
  const item = g.closest('[data-item]'), box = item && item.parentElement; if (!box || !box.hasAttribute('data-sort')) return;
  e.preventDefault(); closeHelp();
  drag = {item, box, group: box.dataset.group || null, id: e.pointerId, moved:false, y0:e.clientY, x0:e.clientX};
});
document.addEventListener('pointermove', e=>{
  if (!drag || e.pointerId!==drag.id) return;
  if (!drag.moved){
    if (Math.abs(e.clientY-drag.y0) + Math.abs(e.clientX-drag.x0) < 4) return;
    drag.moved = true; drag.item.classList.add('dragging'); document.body.classList.add('is-dragging');
    if (drag.box.dataset.compact!==undefined){
      const g = drag.item.querySelector('[data-grip]'), y1 = g.getBoundingClientRect().top;
      drag.box.classList.add('sorting');
      window.scrollBy(0, g.getBoundingClientRect().top - y1);
    }
  }
  e.preventDefault();
  let box = drag.box;
  if (drag.group){
    const hit = $$(`[data-sort][data-group="${drag.group}"]`).find(b=>{ const r = b.getBoundingClientRect(); return e.clientX>=r.left-8 && e.clientX<=r.right+8 && e.clientY>=r.top-10 && e.clientY<=r.bottom+50; });
    if (hit) box = hit;
  }
  const sibs = sortItems(box).filter(x=>x!==drag.item);
  let before = null;
  for (const s of sibs){ const r = s.getBoundingClientRect(); if (e.clientY < r.top + r.height/2){ before = s; break; } }
  if (before){ if (drag.item.nextSibling!==before || drag.item.parentElement!==box) box.insertBefore(drag.item, before); }
  else { const last = sibs[sibs.length-1]; const after = last ? last.nextSibling : null; if (drag.item.parentElement!==box || (last && drag.item.previousSibling!==last)) box.insertBefore(drag.item, after); }
  drag.box = box;
  const top = stickyH() + 60; if (e.clientY < top) window.scrollBy(0,-14); else if (e.clientY > innerHeight-60) window.scrollBy(0,14);
}, {passive:false});
function endDrag(e){
  if (!drag || (e && e.pointerId!==drag.id)) return;
  const d = drag; drag = null; d.item.classList.remove('dragging'); document.body.classList.remove('is-dragging');
  const wasCompact = d.box.classList.contains('sorting'); d.box.classList.remove('sorting');
  if (d.moved){ applyOrder(d.box, d.group);
    if (wasCompact){ const el = document.querySelector(`[data-sort="${d.box.dataset.sort}"] > [data-item="${CSS.escape(d.item.dataset.item)}"]`); if (el) el.scrollIntoView({block:'start'}); } }
}
document.addEventListener('pointerup', endDrag); document.addEventListener('pointercancel', endDrag);
function applyOrder(box, group){
  const p = cur();
  if (group==='toc'){
    const order = [], cardOrder = [];
    $$('[data-sort][data-group="toc"]').forEach(b=>{ const col = b.dataset.sort.split(':')[1];
      sortItems(b).forEach(el=>{ const id = el.dataset.item;
        if (el.dataset.kind==='card'){ if (col==='outcome') cardOrder.push(id); return; }
        const it = p.toc.items.find(x=>x.id===id); if (it){ it.col = col; order.push(it); } }); });
    p.toc.items = order.concat(p.toc.items.filter(x=>!order.includes(x)));
    if (cardOrder.length) p.outcomes.sort((a,b)=>cardOrder.indexOf(a.id)-cardOrder.indexOf(b.id));
    pruneLinks(p);
  } else {
    const arr = SORT_LISTS[box.dataset.sort](p), ids = sortItems(box).map(x=>x.dataset.item);
    arr.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));
  }
  save(); const y = scrollY; render(); scrollTo(0,y); toast('Urutan diubah');
}
document.addEventListener('keydown', e=>{
  const g = e.target.closest && e.target.closest('[data-grip]'); if (!g || (e.key!=='ArrowUp' && e.key!=='ArrowDown')) return;
  const item = g.closest('[data-item]'), box = item && item.parentElement; if (!box || !box.hasAttribute('data-sort')) return;
  e.preventDefault();
  const items = sortItems(box), i = items.indexOf(item), j = i + (e.key==='ArrowUp' ? -1 : 1);
  if (j<0 || j>=items.length) return;
  if (j<i) box.insertBefore(item, items[j]); else box.insertBefore(item, items[j].nextSibling);
  const key = item.dataset.item, sortKey = box.dataset.sort;
  applyOrder(box, box.dataset.group || null);
  const again = document.querySelector(`[data-sort="${sortKey}"] > [data-item="${CSS.escape(key)}"] [data-grip]`) ||
    (box.dataset.group ? [...document.querySelectorAll(`[data-sort="${sortKey}"] > [data-item]`)][j]?.querySelector('[data-grip]') : null);
  if (again) again.focus();
});

<p>Program → Theory of Change (tab 7) → Keselarasan (tab 8) → Stakeholder → Input → Outcome → cek Hasil & Sensitivitas → Checklist. Theory of Change boleh diisi lebih dulu karena membantu menemukan outcome yang akan dinilai.</p>`};
HOWTO.stakeholder = {t:'Cara isi tab Stakeholder', b:`<ol>
  <li>Daftar semua pihak yang <b>berubah</b> karena program, termasuk yang dirugikan. Tanya: siapa yang ikut, siapa yang ada di sekitarnya, siapa yang kehilangan sesuatu?</li>
  <li><b>Jumlah</b> = jumlah orang/unit di kelompok itu. Yang benar-benar berubah diisi nanti di Quantity (tab Outcome).</li>
  <li><b>Cara dilibatkan</b>: tulis metode dan jumlah responden. Contoh: "kuesioner 50 orang + FGD 10 orang, Maret 2025".</li>
  <li><b>Material?</b> Pilih "Ya" kalau perubahannya penting dan cukup besar. Pilih "Tidak" dan tulis alasannya kalau tidak dihitung.</li>
</ol>
<h4>Contoh daftar stakeholder (program bank sampah)</h4>
<div class="tw"><table><thead><tr><th>Stakeholder</th><th>Peran</th><th>Jumlah</th><th>Cara dilibatkan</th><th>Material?</th></tr></thead><tbody>
  <tr><td>Ibu peserta</td><td>Penerima manfaat utama</td><td>50</td><td>Kuesioner 50 + FGD 10</td><td>Ya</td></tr>
  <tr><td>Keluarga peserta</td><td>Ikut merasakan penghasilan</td><td>50 KK</td><td>Wawancara 10 KK</td><td>Tidak, sudah tercakup di outcome ibu (hindari hitung ganda)</td></tr>
  <tr><td>Pengepul lama</td><td>Terdampak, bisa negatif</td><td>3</td><td>Wawancara</td><td>Tidak, dihitung lewat displacement</td></tr>
  <tr><td>Pemerintah desa</td><td>Mitra</td><td>1</td><td>Wawancara kepala desa</td><td>Tidak, perubahannya kecil</td></tr>
  <tr><td>Karyawan relawan</td><td>Menyumbang waktu</td><td>20</td><td>Survei singkat</td><td>Ya kalau ada outcome bagi relawan. Waktu mereka masuk tab Input.</td></tr>
</tbody></table></div>`};
HOWTO.input = {t:'Cara isi tab Input', b:`<ol>
  <li>Masukkan <b>semua</b> sumber daya, bukan hanya dana CSR: honor pendamping, barang donasi, waktu relawan, kontribusi mitra (in-kind).</li>
  <li>Nilai non-uang dirupiahkan. Waktu relawan = jumlah orang × jam × nilai per jam.</li>
  <li>Tulis sumber angka (RAB, laporan realisasi, data HR) supaya bisa dicek.</li>
  <li>Input yang lengkap membuat rasio lebih kecil tapi lebih jujur. Input yang terlewat membuat rasio terlihat lebih besar dari kenyataan.</li>
</ol>
<h4>Contoh baris input</h4>
<div class="tw"><table><thead><tr><th>Uraian</th><th>Jenis</th><th class="num">Nilai</th><th>Cara hitung / sumber</th></tr></thead><tbody>
  <tr><td>Dana program (pelatihan, alat, pendampingan)</td><td>Uang</td><td class="num">Rp 100.000.000</td><td>Laporan realisasi anggaran</td></tr>
  <tr><td>Waktu relawan karyawan</td><td>Waktu/tenaga</td><td class="num">Rp 19.200.000</td><td>20 orang × 16 jam × Rp 60.000/jam (angka ilustrasi, pakai data HR)</td></tr>
  <tr><td>Ruang pertemuan dari balai desa</td><td>Barang/natura</td><td class="num">Rp 3.000.000</td><td>12 kali × Rp 250.000 (harga sewa setempat)</td></tr>
</tbody></table></div>`};
HOWTO.outcome = {t:'Cara isi tab Outcome & filter', b:`<p>Satu kartu = satu perubahan untuk satu stakeholder. Isi dari atas ke bawah:</p>
<ol>
  <li><b>Rantai perubahan</b>: pilih stakeholder, tulis output (apa yang dihasilkan), lalu outcome (apa yang berubah). Uji dengan pertanyaan "lalu kenapa?" sampai ketemu perubahan yang dirasakan stakeholder.</li>
  <li><b>Indikator & sumber data</b>: bagaimana membuktikan perubahan itu, dan datanya dari mana.</li>
  <li><b>Quantity</b>: jumlah yang benar-benar berubah, bukan jumlah peserta.</li>
  <li><b>Proxy</b>: nilai rupiah 1 satuan outcome selama 1 tahun, lengkap dengan uraian dan sumber. Lihat <button class="link" data-tab="panduan" data-anchor="ideProxy">Bank ide proxy</button> di tab Panduan.</li>
  <li><b>Durasi</b>: berapa tahun perubahan bertahan, dengan alasannya.</li>
  <li><b>4 filter</b>: deadweight, attribution, displacement, drop-off. Setiap angka perlu alasan atau bukti.</li>
</ol>
<h4>Output atau outcome?</h4>
<div class="exbox"><span class="bad">✘ "50 ibu dilatih"</span> → ini output (kegiatannya terjadi)<br>
<span class="bad">✘ "Ibu senang ikut pelatihan"</span> → kepuasan peserta, belum perubahan<br>
<span class="good">✔ "Ibu punya penghasilan tambahan dari jual sampah terpilah"</span> → outcome, bisa diukur dan dinilai</div>
<h4>Contoh pertanyaan kuesioner untuk filter</h4>
<div class="tw"><table><thead><tr><th>Filter</th><th>Pertanyaan ke stakeholder</th><th>Cara mengubahnya jadi angka</th></tr></thead><tbody>
  <tr><td>Deadweight</td><td>"Seandainya tidak ada program ini, seberapa mungkin Ibu tetap memilah dan menjual sampah?" (tidak mungkin / kecil / sedang / besar / pasti)</td><td>Rata-rata jawaban (0 / 25 / 50 / 75 / 100%), atau % responden yang sudah melakukannya sebelum program (baseline)</td></tr>
  <tr><td>Attribution</td><td>"Dari semua pihak yang membantu Ibu (pemda, LSM lain, keluarga), seberapa besar peran pihak lain itu?"</td><td>Rata-rata porsi pihak lain. Kalau peran program 75%, attribution = 25%</td></tr>
  <tr><td>Displacement</td><td>Ke pihak lain: "Apakah Bapak kehilangan pasokan atau pelanggan sejak ada bank sampah?"</td><td>Perkiraan porsi manfaat yang hanya berpindah dari pihak lain</td></tr>
  <tr><td>Drop-off</td><td>Tahun berikutnya: "Apakah Ibu masih rutin menyetor?", atau lihat data setoran</td><td>Penurunan per tahun. Dari 40 aktif jadi 32 aktif = 20%</td></tr>
</tbody></table></div>
<p class="tiny">Kalau belum ada data, pakai angka dari program serupa atau kajian, tulis sumbernya, lalu uji di tab Sensitivitas.</p>`};
HOWTO.hasil = {t:'Cara membaca tab Hasil', b:`<ol>
  <li><b>Rasio SROI 1 : X</b> berarti tiap Rp 1 input menghasilkan nilai sosial sekitar Rp X (nilai kini, setelah filter).</li>
  <li>Perbaiki dulu semua <b>⛔ error</b>. Rasio belum valid selama masih ada error.</li>
  <li>Baca <b>⚠️ peringatan</b>. Tidak harus nol, tapi peringatan yang dibiarkan sebaiknya dijelaskan di Lingkup atau Catatan.</li>
  <li>Lihat porsi per outcome. Kalau satu outcome menyumbang lebih dari separuh nilai, pastikan buktinya paling kuat.</li>
</ol>
<h4>Contoh kalimat untuk laporan</h4>
<div class="exbox">"Setiap Rp 1 yang diinvestasikan pada program ini menghasilkan nilai sosial sekitar Rp 1,78 (nilai kini, discount rate 3,5%, setelah memperhitungkan deadweight, attribution, displacement dan drop-off). Dalam uji sensitivitas, rasio berada di kisaran 1 : [terendah] sampai 1 : [tertinggi]."</div>
<p class="tiny">Selalu laporkan rasio bersama kisarannya dari tab Sensitivitas, bukan satu angka saja.</p>`};
HOWTO.sens = {t:'Cara memakai tab Sensitivitas', b:`<ol>
  <li><b>Coba-coba skenario</b>: geser asumsi untuk melihat efeknya. Data tidak berubah.</li>
  <li><b>Uji satu per satu</b>: lihat asumsi mana yang paling menggerakkan rasio (baris teratas grafik). Asumsi itu yang buktinya perlu paling kuat.</li>
  <li><b>Titik impas</b>: seberapa jauh asumsi harus meleset sampai nilai sosial sama dengan biaya. Makin jauh, makin aman klaimnya.</li>
</ol>
<h4>Contoh kesimpulan</h4>
<div class="exbox">"Rasio paling sensitif terhadap proxy penghasilan. Rasio baru turun ke 1 : 1 kalau proxy turun lebih dari 40%, jadi klaim nilai sosial positif cukup kuat." <span class="tiny">(angka ilustrasi)</span></div>`};
HOWTO.toc = {t:'Cara isi Theory of Change', b:`<p>Theory of Change (ToC) menjelaskan <b>bagaimana</b> kegiatan program menghasilkan perubahan. Cara paling mudah: mulai dari ujung (impact), lalu mundur.</p>
<ol>
  <li>Belum pernah menyusun? Klik <b>🧭 Susun dengan panduan</b>: 9 pertanyaan berurutan, jawabannya langsung jadi kotak. Atau pilih <b>template</b> yang paling mirip, lalu sesuaikan.</li>
  <li>Di diagram, klik <b>✎</b> pada kotak untuk mengubah isinya, menambah panah (<i>mengarah ke</i>), dan indikator. Klik <b>+ Tambah</b> di bawah kolom untuk kotak baru.</li>
  <li>Kolom <b>Outcome jangka menengah</b> otomatis berisi kartu dari tab Outcome. Outcome yang baru ada di ToC bisa dijadikan kartu lewat ✎ → <b>Jadikan kartu outcome</b>.</li>
  <li>Baca <b>Cek kualitas</b> di bagian bawah: kotak yang belum terhubung, atau outcome yang terdengar seperti output.</li>
</ol>
<h4>Bedanya tiap level (contoh bank sampah)</h4>
<div class="tw"><table><thead><tr><th>Level</th><th>Pertanyaan</th><th>Contoh</th></tr></thead><tbody>
  <tr><td>Output</td><td>Apa yang dihasilkan kegiatan?</td><td>50 ibu dilatih, 1 bank sampah beroperasi</td></tr>
  <tr><td>Outcome jangka pendek</td><td>Apa yang berubah dalam hitungan bulan?</td><td>Ibu paham cara memilah dan tahu harga jual sampah</td></tr>
  <tr><td>Outcome jangka menengah</td><td>Perilaku/kondisi apa yang berubah?</td><td>Ibu rutin menyetor; penghasilan tambahan Rp 300 rb/bulan</td></tr>
  <tr><td>Impact</td><td>Perubahan jangka panjang apa yang lebih luas?</td><td>Kesejahteraan keluarga naik, sampah ke sungai berkurang</td></tr>
</tbody></table></div>`};
HOWTO.selaras = {t:'Cara isi tab Keselarasan', b:`<p>Tab ini mencatat program selaras dengan apa saja: <b>regulasi</b>, <b>SDGs</b>, dan <b>unit lain di kantor</b>. Isinya dokumentasi dan tidak mengubah rasio SROI.</p>
<h4>A. Regulasi</h4>
<ol>
  <li>Cari tiga jenis: (1) yang <b>mewajibkan</b> (mis. TJSL di UU Perseroan Terbatas), (2) program pemerintah yang <b>didukung</b> (mis. pengelolaan sampah), (3) dasar <b>pelaporan</b> (mis. laporan keberlanjutan).</li>
  <li>Tulis pasal/bagian yang relevan dan satu kalimat kaitannya. Daftar saran muncul saat mengetik, tapi <b>cek ulang nomor dan status berlakunya</b> dengan tim legal/kepatuhan.</li>
</ol>
<div class="exbox"><b>Contoh:</b> UU No. 18 Tahun 2008 tentang Pengelolaan Sampah · <i>Mendukung program pemerintah</i> · "Bank sampah mendorong pemilahan dan daur ulang di sumber. Bukti: catatan setoran kg per jenis."</div>
<h4>B. SDGs</h4>
<ol>
  <li>Pilih 1–2 tujuan <b>utama</b> dan beberapa <b>pendukung</b>. Memilih terlalu banyak SDGs justru melemahkan klaim.</li>
  <li>Isi <b>target</b> (mis. 12.5), bukan hanya nomor tujuan. Ketik nomornya untuk melihat saran.</li>
  <li>Hubungkan ke <b>outcome</b> di tab Outcome dan tulis kontribusinya dengan angka.</li>
</ol>
<div class="exbox"><b>Contoh:</b> SDG 12 (utama) · target 12.5 · "1,2 ton sampah/tahun terpilah dan terjual lewat bank sampah" <span class="tiny">(angka ilustrasi)</span></div>
<h4>C. Unit terkait & creating shared value</h4>
<p><i>Creating shared value</i> (CSV, Porter & Kramer 2011) = menyelesaikan masalah sosial dengan cara yang sekaligus menciptakan nilai bisnis. Catat unit mana yang terkait, perannya, dan nilai bisnis yang mungkin muncul.</p>
<div class="exbox"><b>Contoh:</b> Kantor cabang terdekat · <i>Kantor cabang</i> · peran: membuka rekening untuk nasabah bank sampah · manfaat: nasabah baru · CSV tingkat 1 · indikator: jumlah rekening baru dari peserta.</div>
<p class="tiny">Manfaat bagi perusahaan dicatat terpisah dan <b>tidak</b> ikut dihitung di rasio SROI, supaya tidak klaim berlebihan atau hitung ganda.</p>`};
HOWTO.checklist = {t:'Cara isi tab Review', b:`<ol>
  <li>Isi <b>catatan review</b>: siapa yang memeriksa, kapan, temuan, dan keputusan tindak lanjut.</li>
  <li>Centang prinsip yang sudah dipenuhi.</li>
  <li>Tulis bukti singkat: dokumen, tanggal, siapa. Contoh untuk "Verifikasi hasil": "Direview tim M&E (Sari) 12 Mei 2025; catatan revisi di file v2."</li>
  <li>Prinsip yang belum terpenuhi tidak perlu dipaksa dicentang. Tulis rencananya di kolom bukti.</li>
</ol>`};

/* ---- v2: panduan tab yang berubah ---- */
HOWTO.program = {t:'Cara isi tab Program', b:`<ol>
  <li>Isi <b>nama</b> dan pilih <b>tahap</b>: <i>Usulan</i> untuk proposal, <i>Evaluasi</i> untuk menilai program yang sudah berjalan. Susunan tab mengikuti tahap ini.</li>
  <li>Tulis <b>tujuan terukur</b>, <b>dukungan yang diminta</b> dari mitra, dan rencana <b>keberlanjutan</b>.</li>
  <li>Isi <b>tahun awal</b> dan <b>tahun akhir</b>. Kolom per tahun di tab Anggaran dan Outcome menyesuaikan.</li>
  <li>Isi <b>BI Rate</b> dan <b>bulan dihitung</b> tiap tahun. Rate yang dipakai = rata-rata; ingin satu rate tetap, isi tahun pertama lalu klik <b>Samakan rate</b>.</li>
  <li>Program di beberapa tempat atau angkatan? Tambah <b>lokasi</b> supaya hasil keluar per lokasi dan gabungan.</li>
  <li>Tulis <b>lingkup</b>: apa yang dihitung dan tidak.</li>
</ol>
<h4>Contoh perhitungan nilai saat ini</h4>
<div class="exbox">Periode 2024–2025 (evaluasi), BI Rate 2024 = 6% dan 2025 = 4,75% → rata-rata <b>5,375%</b>.<br>
Manfaat 2024 Rp 100 juta × (1 + 5,375%)<sup>1</sup> = <b>Rp 105,4 juta</b>. Manfaat 2025 Rp 100 juta × (1 + 5,375%)<sup>0</sup> = <b>Rp 100 juta</b>.<br>
Investasi dibawa dengan cara yang sama, lalu SROI = total manfaat saat ini ÷ total investasi saat ini.</div>
<h4>Urutan pengisian</h4>
<p>Ikuti nomor tab di atas. Urutannya sudah disusun sesuai tahap; tab bisa disembunyikan lewat <b>⚙ Atur tampilan</b>. Progres tiap langkah terlihat di <b>Ikhtisar</b>.</p>`};
HOWTO.stakeholder = {t:'Cara isi tab Stakeholder', b:`<ol>
  <li>Daftar semua kelompok yang <b>berubah</b> karena program, termasuk yang dirugikan dan perusahaan sendiri (untuk PR value).</li>
  <li>Pilih <b>jenis</b>, isi <b>jumlah</b>, dan tulis <b>cara dilibatkan</b> (metode + jumlah responden).</li>
  <li><b>Material?</b> Ya → buat outcome-nya. Tidak → tulis alasannya.</li>
</ol>
<h4>Contoh</h4>
<div class="tw"><table><thead><tr><th>Stakeholder</th><th>Jenis</th><th>Jumlah</th><th>Cara dilibatkan</th><th>Material?</th></tr></thead><tbody>
  <tr><td>Peserta MUA Tuli</td><td>Penerima manfaat langsung</td><td>10</td><td>Kuesioner pre-post 10 peserta</td><td>Ya</td></tr>
  <tr><td>Klien jasa MUA</td><td>Penerima manfaat tidak langsung</td><td>40</td><td>Survei singkat 12 klien</td><td>Ya</td></tr>
  <tr><td>Pelatih</td><td>Fasilitator / mitra</td><td>3</td><td>Wawancara</td><td>Ya</td></tr>
  <tr><td>Pengepul lama</td><td>Penerima manfaat tidak langsung</td><td>3</td><td>Wawancara</td><td>Tidak, sudah dihitung lewat displacement</td></tr>
  <tr><td>BCA</td><td>Pemrakarsa program</td><td>1</td><td>Data publikasi tim komunikasi</td><td>Ya (PR value)</td></tr>
</tbody></table></div>`};
HOWTO.input = {t:'Cara isi tab Input', b:`<ol>
  <li>Satu baris = satu pos biaya di satu tahun. Pilih <b>tahun</b> dana dikeluarkan dan, kalau ada, <b>lokasi</b>-nya.</li>
  <li>Masukkan <b>semua</b> sumber daya: dana program, honor vendor, pajak, waktu staf/relawan, barang donasi, kontribusi mitra.</li>
  <li>Kolom nilai menerima <b>rumus</b> seperti Excel. Hasilnya muncul di bawah kolom untuk dicek.</li>
  <li>Input yang lengkap membuat rasio lebih kecil tapi lebih jujur.</li>
</ol>
<h4>Contoh baris input (cara worksheet konsultan)</h4>
<div class="tw"><table><thead><tr><th>Tahun</th><th>Uraian</th><th>Ketik di kolom nilai</th><th>Keterangan</th></tr></thead><tbody>
  <tr><td>2024</td><td>Subsidi UKT dan uang saku</td><td><code>3.345.000.000 + 4.200.000.000</code></td><td>Dua pos dijumlahkan</td></tr>
  <tr><td>2024</td><td>Pajak 11% jasa pengembangan program</td><td><code>2.815.950.000 × 11%</code></td><td>Pajak ikut dihitung sebagai input</td></tr>
  <tr><td>2024</td><td>Pameran (dipakai 2 lokasi)</td><td><code>17.646.640 / 2</code></td><td>Biaya bersama dibagi rata ke tiap lokasi</td></tr>
  <tr><td>2023</td><td>Waktu staf kurasi</td><td><code>2 × 10,75 × 35.000.000 / 22</code></td><td>orang × hari kerja × gaji per bulan ÷ 22 hari</td></tr>
</tbody></table></div>`};
HOWTO.outcome = {t:'Cara isi tab Outcome', b:`<p>Satu kartu = satu outcome untuk satu stakeholder (bisa juga per lokasi atau angkatan). Isi dari atas ke bawah; klik <b>?</b> di tiap kolom untuk detailnya.</p>
<ol>
  <li><b>Outcome</b>: stakeholder, aspek, perubahan yang dialami, indikator, <b>baseline</b> dan <b>target</b>. Saat evaluasi, isi juga <b>realisasi</b> dan perbarui <b>status bukti</b> (proyeksi → terukur → terverifikasi).</li>
  <li><b>Valuasi</b>: pilih metode, tulis <b>proxy & cara hitung</b>, dan sumbernya.</li>
  <li><b>Nilai per tahun</b>: isi nilai manfaat kotor tiap tahun. Boleh rumus: <code>harga satuan × faktor × jumlah</code>.</li>
  <li><b>Fiksasi dampak per tahun</b>: deadweight, attribution, displacement, drop-off. Angkanya boleh beda tiap tahun.</li>
  <li><b>Penjelasan</b>: satu penjelasan per filter, berlaku untuk semua tahun.</li>
</ol>
<h4>Contoh nilai manfaat (dari worksheet konsultan)</h4>
<div class="tw"><table><thead><tr><th>Metode</th><th>Ketik di kolom nilai</th><th>Artinya</th></tr></thead><tbody>
  <tr><td>Training cost equivalent</td><td><code>30.928.000 × 28,1% × 15</code></td><td>Biaya kursus setara × % peningkatan skor (pre-post) × 15 peserta</td></tr>
  <tr><td>Income approach</td><td><code>1.322.857 × 6 × 15</code></td><td>Tambahan pendapatan per bulan × 6 bulan × 15 orang</td></tr>
  <tr><td>Replacement cost</td><td><code>3.450.000 × 17 × 50%</code></td><td>Biaya layanan setara × 17 orang × 50% peningkatan</td></tr>
  <tr><td>Avoided cost</td><td><code>14.500 × 4.700</code></td><td>Biaya per unit yang dihindari × 4.700 unit</td></tr>
</tbody></table></div>
<h4>Drop-off: dua cara</h4>
<div class="exbox">Tahun pertama outcome biasanya drop-off 0%. Untuk tahun berikutnya, tulis berapa persen nilainya turun <b>dibanding tahun pertama</b>. Pakai tombol <b>Drop-off majemuk</b> untuk mengisi otomatis: 15% per tahun → 0%, 15%, 27,75%, 38,59%, … (sama dengan rumus (1 − 15%)<sup>n</sup> di worksheet konsultan).</div>
<h4>Contoh pertanyaan kuesioner untuk fiksasi dampak</h4>
<div class="tw"><table><thead><tr><th>Filter</th><th>Pertanyaan ke stakeholder</th><th>Cara mengubahnya jadi angka</th></tr></thead><tbody>
  <tr><td>Deadweight</td><td>"Seandainya tidak ada program ini, apakah perubahan ini tetap terjadi?"</td><td>% responden yang menjawab ya, atau rata-rata jawaban 0/25/50/75/100%. Contoh: 2 dari 15 → 13%</td></tr>
  <tr><td>Attribution</td><td>"Selain program ini, pihak lain mana yang ikut membantu, dan seberapa besar perannya?"</td><td>Rata-rata porsi pihak lain</td></tr>
  <tr><td>Displacement</td><td>Ke pihak lain: "Apakah Bapak kehilangan pelanggan/pasokan sejak ada program?"</td><td>Porsi manfaat yang hanya berpindah</td></tr>
  <tr><td>Drop-off</td><td>Tahun berikutnya: "Apakah manfaat ini masih Anda rasakan?"</td><td>Penurunan dibanding tahun pertama</td></tr>
</tbody></table></div>
<p class="tiny">Outcome yang belum bisa dirupiahkan tetap dicatat: centang <b>Outcome kualitatif</b>. Lihat juga <button class="link" data-tab="panduan" data-anchor="ideProxy">Bank ide proxy</button>.</p>`};
HOWTO.hasil = {t:'Cara membaca tab Hasil', b:`<ol>
  <li><b>SROI 1 : X</b> = tiap Rp 1 investasi (nilai saat ini) menghasilkan nilai sosial sekitar Rp X (nilai saat ini, setelah fiksasi dampak).</li>
  <li><b>Per tahun</b>: SROI tiap tahun dihitung dari manfaat dan investasi tahun itu saja, seperti tabel ringkasan di worksheet konsultan.</li>
  <li><b>Payback period</b>: berapa bulan sampai manfaat menutup investasi, dengan anggapan manfaat merata per bulan.</li>
  <li><b>Fiksasi dampak</b>: berapa persen nilai kotor yang dikurangi oleh deadweight, attribution, displacement, dan drop-off.</li>
  <li>Kalau ada outcome untuk <b>pemrakarsa</b> (mis. PR value), rasio juga ditampilkan tanpa manfaat itu.</li>
</ol>

/* ---- Kalimat ringkas, perbandingan usulan vs evaluasi, grafik nilai ---- */
const SIMPLE = {dw:'Tetap terjadi tanpa program', attr:'Peran pihak lain', disp:'Menggeser manfaat pihak lain', drop:'Manfaat memudar'};
const filterLabel = (p, k, lab) => tahapOf(p)==='usulan' ? `${SIMPLE[k]} (${lab.toLowerCase()})` : lab;
function sensRange(p){ const st = sensTests(p); if (st.base==null) return null; const v = st.tests.flatMap(t=>[t.lo,t.hi]).filter(x=>x!=null && isFinite(x)); return v.length ? [Math.min(...v), Math.max(...v)] : null; }
function summarySentence(p, res){
  const us = tahapOf(p)==='usulan', ys = res.ys, per = ys.length>1 ? `${ys[0]}–${ys[ys.length-1]}` : String(ys[0]);
  const money = res.rows.filter(r=>!r.o.kualitatif).length, kual = p.outcomes.filter(o=>o.kualitatif).length;
  if (res.sroi==null) return `Rasio SROI belum bisa dihitung. Lengkapi ${tabRef('input')} dan nilai di ${tabRef('outcome')}.`;
  const rg = sensRange(p);
  let s = us
    ? `Program ini <b>diperkirakan</b> menghasilkan nilai sosial sekitar <b>Rp ${fmtNum(res.sroi,2)} untuk setiap Rp 1</b> investasi (proyeksi ${per}, rate ${fmtRate(res.r)}).`
    : `Selama ${per}, setiap Rp 1 investasi menghasilkan nilai sosial sekitar <b>Rp ${fmtNum(res.sroi,2)}</b> (nilai saat ini dengan rate ${fmtRate(res.r)}, setelah fiksasi dampak).`;
  if (res.payback!=null) s += ` Investasi ${us?'diperkirakan ':''}kembali dalam sekitar <b>${fmtNum(res.payback,1)} bulan</b>.`;
  s += ` Angka ini berasal dari ${money} outcome yang dirupiahkan${kual?`; ${kual} outcome lain dicatat kualitatif`:''}.`;
  if (rg) s += ` Dalam uji sensitivitas, rasio berada di kisaran 1 : ${fmtRatio(rg[0])} sampai 1 : ${fmtRatio(rg[1])}.`;
  if (res.sroiNoPem!=null) s += ` Tanpa manfaat bagi perusahaan (mis. PR value), rasionya 1 : ${fmtRatio(res.sroiNoPem)}.`;
  return s;
}
const STATUS_O = [['proyeksi','Proyeksi'],['terukur','Terukur'],['terverifikasi','Terverifikasi']];
const STATUS_B = [['potensi','Potensi'],['proyeksi','Proyeksi'],['terukur','Terukur'],['terverifikasi','Terverifikasi']];
const statusBadge = (st, list) => st ? `<span class="stb stb-${esc(st)}">${esc(optName(list||STATUS_O, st) || st)}</span>` : '';
function snapshotUsulan(p, res){

function bandingTable(p, res){
  const u = p.usulan; if (!u) return '';
  const rows = p.outcomes.map(o=>{ const a = u.outcomes.find(x=>x.id===o.id), r = res.rows.find(x=>x.o.id===o.id);
    return `<tr><td>${esc(o.outcome||'–')} ${statusBadge(o.status)}</td><td>${esc(o.target || (a&&a.target) || '–')}</td><td>${esc(o.realisasi||'–')}</td>
      <td class="num">${a && !o.kualitatif ? fmtRp(a.net) : '–'}</td><td class="num">${r && !o.kualitatif ? fmtRp(r.net) : '–'}</td></tr>`; }).join('');
  return `<p class="small muted">Pembanding: angka usulan yang disimpan tanggal ${esc(u.tanggal)}. Nilai bersih ditulis nominal (belum dibawa ke nilai saat ini) supaya bisa dibandingkan.</p>

    <tbody>${rows}<tr class="tot"><td colspan="3">SROI</td><td class="num">1 : ${fmtRatio(u.sroi)}</td><td class="num">1 : ${fmtRatio(res.sroi)}</td></tr>
    <tr class="tot"><td colspan="3">Total nilai bersih / investasi nominal</td><td class="num">${fmtRp(u.totalNet)} / ${fmtRp(u.totalInput)}</td><td class="num">${fmtRp(res.totalNet)} / ${fmtRp(res.totalInput)}</td></tr></tbody></table></div>`;
}
function fiksasiChart(p, res){
  const c = res.cuts; if (!(c.gross>0)) return `<p class="small muted">Grafik muncul setelah ada nilai manfaat.</p>`;
  const time = res.totalPV - res.totalNet;
  const steps = [['Nilai kotor (outcome positif)', c.gross, 'tot'], [`− ${filterLabel(p,'dw','Deadweight')}`, -c.dw], [`− ${filterLabel(p,'attr','Attribution')}`, -c.at],
    [`− ${filterLabel(p,'disp','Displacement')}`, -c.di], [`− ${filterLabel(p,'drop','Drop-off')}`, -c.dr], ['= Nilai bersih', c.net, 'tot']];
  if (c.negNet) steps.push(['− Outcome negatif', c.negNet]);
  steps.push([`${time>=0?'+':'−'} Penyesuaian ke nilai saat ini (tahun ${res.ref})`, time], ['= Nilai saat ini', res.totalPV, 'tot']);
  const max = Math.max(c.gross, c.net + Math.max(0,time), res.totalPV, 1);
  let run = 0;
  const bars = steps.map(([lab, v, kind])=>{
    let left, w, cls;
    if (kind==='tot'){ run = v; left = 0; w = v; cls = 'wf-tot'; }
    else { const a = run, b = run + v; left = Math.min(a,b); w = Math.abs(v); run = b; cls = v<0 ? 'wf-neg' : 'wf-pos'; }
    return `<div class="b"><div>${esc(lab)}</div><div class="track"><div class="fill ${cls}" style="left:${(Math.max(0,left)/max*100).toFixed(2)}%;width:${(Math.max(0,w)/max*100).toFixed(2)}%"></div></div><div class="num">${fmtRpShort(v)}</div></div>`;
  }).join('');
  return `<div class="bars wf">${bars}</div><div class="tiny muted">Pengurangan dihitung berurutan: deadweight dulu, lalu attribution, displacement, dan drop-off. Penyesuaian ke nilai saat ini memakai rate ${fmtRate(res.r)}.</div>`;
}

function stepStatus(p, k, W){
  const ws = W.filter(w=>w.tab===k), e = ws.filter(w=>w.lvl==='err').length, w = ws.filter(w=>w.lvl==='warn').length;
  const empty = {program: isBlank(p.tujuan) && isBlank(p.lingkup), stakeholder:!p.stakeholders.length, input:!p.inputs.length, outcome:!p.outcomes.length,
    toc:!p.toc.items.length && isBlank(p.toc.masalah), selaras:!p.sdgs.length && !p.regulasi.length, checklist: !p.checklist.some(c=>c.done) && isBlank(p.review.nama)}[k];
  if (empty) return ['todo','Belum diisi'];
  if (e) return ['err', `${e} perlu diperbaiki`];
  if (w) return ['warn', `${w} perlu dilengkapi`];
  return ['ok','Beres'];
}

}

/* ---- 2. Stakeholder ---- */

/* ---- 3. Input ---- */

    <tbody>${res.byYear.map(t=>`<tr><td>${t.y}</td><td class="num">${fmtRp(t.inp)}</td><td class="num">× ${fmtNum(t.f,4)}</td><td class="num">${fmtRp(t.inpPV)}</td></tr>`).join('')}
