/* ---- 6. Sensitivitas ---- */
function sensTests(p){
  const base = compute(p).sroi;
  const S = p.sens; const g = k => Math.max(0, val(S[k],0));
  const t1 = x => fmtNum(x,1).replace(/,0$/,'');
  const tests = [
    ['Deadweight', `±${t1(g('dwPP'))} poin %`, {dwAdd:-g('dwPP')}, {dwAdd:g('dwPP')}],
    ['Attribution', `±${t1(g('attrPP'))} poin %`, {attrAdd:-g('attrPP')}, {attrAdd:g('attrPP')}],
    ['Displacement', `±${t1(g('dispPP'))} poin %`, {dispAdd:-g('dispPP')}, {dispAdd:g('dispPP')}],
    ['Drop-off', `±${t1(g('dropPP'))} poin %`, {dropAdd:-g('dropPP')}, {dropAdd:g('dropPP')}],
    ['Nilai manfaat (proxy)', `±${t1(g('proxyPct'))}%`, {proxyPct:-g('proxyPct')}, {proxyPct:g('proxyPct')}],
    ['Rate', `${t1(g('drLow'))}% s/d ${t1(g('drHigh'))}%`, {r:g('drLow')}, {r:g('drHigh')}]
  ].map(([n,desc,a,b])=>{ const A = compute(p,a).sroi, B = compute(p,b).sroi; return {n,desc,lo:Math.min(A,B),hi:Math.max(A,B),A,B}; });
  return {base, tests, noPem: compute(p).sroiNoPem};
}
function breakEven(p){
  const base = compute(p).sroi; if (base==null) return [];
  const f = ov => compute(p, ov).sroi;
  const out = [];
  const add = (n, x, txt) => out.push({n, txt: x==null ? 'Tidak tercapai dalam rentang wajar' : txt(x)});
  add('Semua deadweight ditambah', solveOne(x=>f({dwAdd:x}),-100,100), x=>`${x>=0?'+':''}${fmtNum(x,1)} poin %`);
  add('Semua attribution ditambah', solveOne(x=>f({attrAdd:x}),-100,100), x=>`${x>=0?'+':''}${fmtNum(x,1)} poin %`);
  add('Semua drop-off ditambah', solveOne(x=>f({dropAdd:x}),-100,100), x=>`${x>=0?'+':''}${fmtNum(x,1)} poin %`);
  add('Semua nilai manfaat diubah', solveOne(x=>f({proxyPct:x}),-100,2000), x=>`${x>=0?'+':''}${fmtNum(x,1)}%`);
  return out;
}
function tornado(st){
  const vals = st.tests.flatMap(t=>[t.lo,t.hi]).concat([st.base,1]).filter(v=>v!=null&&isFinite(v));
  if (!vals.length) return '';
  let mn = Math.min(...vals), mx = Math.max(...vals); if (mx-mn<1e-9){ mx+=0.5; mn-=0.5; }
  const pad = (mx-mn)*0.06; mn-=pad; mx+=pad;
  const X = v => ((v-mn)/(mx-mn)*100).toFixed(2);
  const sorted = st.tests.slice().sort((a,b)=>(b.hi-b.lo)-(a.hi-a.lo));
  return `<div class="bars tor">${sorted.map(t=>`<div class="b"><div>${t.n} <span class="tiny muted">${t.desc}</span></div>
    <div class="track"><div class="rng" style="left:${X(t.lo)}%;width:${(X(t.hi)-X(t.lo)).toFixed(2)}%"></div><div class="base" style="left:${X(st.base)}%"></div>${mn<1&&mx>1?`<div class="one" style="left:${X(1)}%"></div>`:''}</div>
    <div class="num">${fmtRatio(t.lo)} – ${fmtRatio(t.hi)}</div></div>`).join('')}</div>
    <div class="tiny muted">Garis hitam = rasio dasar (${fmtRatio(st.base)}). ${mn<1&&mx>1?'Garis putus merah = titik impas 1 : 1.':''} Diurutkan dari yang paling berpengaruh.</div>`;
}
function sensOut(){
  const p = cur(), st = sensTests(p), be = breakEven(p);
  if (st.base==null) return `<div class="card empty">Rasio belum bisa dihitung. Isi input dan outcome dulu.</div>`;
  const ex = p.outcomes.filter(o=>!o.kualitatif).length>1 ? p.outcomes.map((o,i)=> o.kualitatif ? '' : `<tr><td>${i+1}. ${esc(short(o.outcome||'Outcome',60))}</td><td class="num">${fmtRatio(compute(p,{exclude:o.id}).sroi)}</td></tr>`).join('') : '';
  const fragile = st.tests.filter(t=>t.lo<1);
  return `<div class="card"><h2>Uji satu per satu</h2>
      <p class="small muted">Setiap baris mengubah satu asumsi untuk <b>semua outcome dan semua tahun</b>, yang lain tetap. ${fragile.length?`<b style="color:var(--err)">Rasio jatuh di bawah 1 pada: ${fragile.map(t=>t.n).join(', ')}.</b> Ini tanda hasilnya rapuh terhadap asumsi tersebut.`:'<b>Rasio tetap di atas 1 pada semua uji.</b>'}</p>
      ${tornado(st)}
      <div class="tw" style="margin-top:10px"><table><thead><tr><th>Asumsi</th><th>Perubahan</th><th class="num">SROI kalau asumsi diturunkan</th><th class="num">SROI kalau asumsi dinaikkan</th></tr></thead>
      <tbody>${st.tests.map(t=>`<tr><td>${t.n}</td><td>${t.desc}</td><td class="num">${fmtRatio(t.A)}</td><td class="num">${fmtRatio(t.B)}</td></tr>`).join('')}
      ${st.noPem!=null?`<tr><td>Tanpa manfaat pemrakarsa</td><td>outcome stakeholder jenis pemrakarsa dikeluarkan</td><td class="num" colspan="2">${fmtRatio(st.noPem)}</td></tr>`:''}</tbody></table></div>
    </div>
    <div class="card"><h2>Titik impas (SROI = 1 : 1)</h2>
      <p class="small muted">Seberapa jauh asumsi harus berubah sampai nilai sosial sama dengan investasi. Makin jauh dari kondisi sekarang, makin kuat klaimnya.</p>
      <div class="tw"><table><thead><tr><th>Asumsi</th><th>Agar SROI = 1</th></tr></thead><tbody>${be.map(b=>`<tr><td>${b.n}</td><td>${b.txt}</td></tr>`).join('')}</tbody></table></div>
    </div>
    ${ex?`<div class="card"><h2>Kalau satu outcome dikeluarkan</h2><p class="small muted">Berguna untuk melihat apakah rasio bergantung pada satu outcome saja.</p>
      <div class="tw"><table><thead><tr><th>Outcome yang dikeluarkan</th><th class="num">SROI tanpa outcome ini</th></tr></thead><tbody>${ex}</tbody></table></div></div>`:''}`;
}
function scenOut(){
  const p = cur(); const b = compute(p).sroi;
  const ov = {dwAdd:scen.dwAdd, attrAdd:scen.attrAdd, dispAdd:scen.dispAdd, dropAdd:scen.dropAdd, proxyPct:scen.proxyPct};

  return `Rasio dasar <b>1 : ${fmtRatio(b)}</b> → skenario <b style="font-size:1.15rem;color:${s!=null&&s<1?'var(--err)':'var(--accent-2)'}">1 : ${fmtRatio(s)}</b>`;
}

    <div class="grid g4">
      ${fld({label:'Deadweight ± (poin %)', path:'sens:dwPP', type:'num'})}
      ${fld({label:'Attribution ± (poin %)', path:'sens:attrPP', type:'num'})}
      ${fld({label:'Displacement ± (poin %)', path:'sens:dispPP', type:'num'})}
      ${fld({label:'Drop-off ± (poin %)', path:'sens:dropPP', type:'num'})}
      ${fld({label:'Nilai manfaat ± (%)', path:'sens:proxyPct', type:'num'})}
      ${fld({label:'Rate rendah (%)', path:'sens:drLow', type:'num'})}
      ${fld({label:'Rate tinggi (%)', path:'sens:drHigh', type:'num'})}
    </div>
  </div>
  <div data-live="sensOut">${sensOut()}</div>`;
}
function scenLabel(k){
  if (k==='r') return fmtNum(scen.r==null ? compute(cur()).r*100 : scen.r, 2) + '%';
  const v = scen[k]; const sfx = k==='proxyPct' ? '%' : ' poin';
  return (v>0?'+':'') + v + sfx;

const TOC_COLS = [
  ['input','Input','sumber daya','tocInput'],['kegiatan','Kegiatan','yang dikerjakan','tocKegiatan'],['output','Output','hasil langsung','tocOutput'],
  ['outcomePendek','Outcome jangka pendek','pengetahuan, sikap, akses','tocPendek'],['outcome','Outcome jangka menengah','perilaku, kondisi','tocMenengah'],['impact','Impact','jangka panjang','tocImpact']
];
const lines = s => String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
const sdgLabel = g => g && SDGS[+g-1] ? `SDG ${g} · ${SDGS[+g-1]}` : '';
function sdgBadges(p){
  const list = p.sdgs.filter(g=>g.goal).slice().sort((a,b)=>(a.peran==='utama'?0:1)-(b.peran==='utama'?0:1) || (+a.goal)-(+b.goal));
  const seen = new Set();
  return list.filter(g=>{ const k = g.goal+'|'+g.peran; if (seen.has(k)) return false; seen.add(k); return true; })
    .map(g=>`<span class="sdgb${g.peran==='utama'?' utama':''}" title="${g.peran==='utama'?'Tujuan utama':'Tujuan pendukung'}">${esc(sdgLabel(g.goal))}</span>`).join('');
}
function tocDiagram(p, ed){
  const t = p.toc;

  const after = [['Asumsi',t.asumsi],['Risiko & mitigasi',t.risiko],['Bukti / rujukan',t.bukti]].filter(x=>!isBlank(x[1]));
  const sb = sdgBadges(p);
  return `${ctx.length?`<div class="toc-ctx">${ctx.map(([k,v])=>`<div><b>${k}:</b> ${nl2br(v)}</div>`).join('')}</div>`:''}
    <div class="toc">${TOC_COLS.map(([k,l,sub])=>{ const items = lines(t[k]);
      return `<div class="col"${ed?` data-sort="toc:${k}" data-group="toc"`:''}><h4>${l}<small>${sub}</small></h4>${
        ed ? items.map((x,i)=>`<div class="it" data-item="${k}-${i}" data-text="${esc(x)}">${grip(x)}<span>${esc(x)}</span></div>`).join('') + (items.length?'':'<div class="it muted">–</div>')
           : (items.map(x=>`<div class="it">${esc(x)}</div>`).join('') || '<div class="it muted">–</div>')}</div>`; }).join('')}</div>
    ${after.length?`<div class="toc-ctx" style="margin-top:12px">${after.map(([k,v])=>`<div><b>${k}:</b> ${nl2br(v)}</div>`).join('')}</div>`:''}
    ${sb?`<div class="toc-sdg"><b>Kontribusi SDGs:</b> ${sb}</div>`:''}`;
}

function contohHitung(){
  const sp = sampleProgram(), r = compute(sp), o = r.rows[0]; if (!o) return '';
  const [a,b] = o.years, pc = x => fmtPct(x), rr = fmtRate(r.r);
  return `<p class="small">Outcome #1 program CONTOH (penghasilan tambahan ibu, Desa Sukamaju), periode ${r.ys[0]}–${r.ys[r.ys.length-1]}:</p>
  <ol class="small">
    <li>Nilai kotor ${a.y} = 25 × Rp 300.000 × 12 bulan = ${fmtRp(a.gross)}. Nilai bersih = ${fmtRp(a.gross)} × (1 − ${pc(a.dw)}) × (1 − ${pc(a.at)}) × (1 − ${pc(a.di)}) × (1 − ${pc(a.dr)}) = <b>${fmtRp(a.net)}</b>.</li>
    <li>Nilai kotor ${b.y} = 25 × Rp 300.000 × 11 bulan = ${fmtRp(b.gross)}, dengan drop-off ${pc(b.dr)} → nilai bersih <b>${fmtRp(b.net)}</b>.</li>
    <li>Rate = rata-rata BI Rate ${r.ys.join(' dan ')} = ${rr}. Nilai saat ini (tahun ${r.ref}) = ${fmtRp(a.net)} × (1 + ${rr})¹ + ${fmtRp(b.net)} × (1 + ${rr})⁰ = <b>${fmtRp(o.pv)}</b>.</li>
    <li>Semua outcome dijumlahkan → ${fmtRp(r.totalPV)}. Investasi saat ini ${fmtRp(r.totalInputPV)}. SROI = <b>1 : ${fmtRatio(r.sroi)}</b>${r.sroiNoPem!=null?` (tanpa PR value pemrakarsa 1 : ${fmtRatio(r.sroiNoPem)})`:''}. Payback = ${fmtRp(r.totalInputPV)} ÷ (${fmtRp(r.totalPV)} ÷ ${fmtNum(r.months)} bulan) = ${fmtBln(r.payback)}.</li>
  </ol>`;
}

  <h3>Mengikuti worksheet konsultan</h3>

const RENDER = {program:tProgram, stakeholder:tStakeholder, input:tInput, outcome:tOutcome, hasil:tHasil, sens:tSens, toc:tToc, selaras:tSelaras, checklist:tChecklist, ringkasan:tRingkasan, panduan:tPanduan};

function render(){
  closeHelp();
  renderProgSelect(); renderBanner();
  $('#main').innerHTML = RENDER[tab]();
  renderBadge();
}

/* ---- Live updates without re-render (keeps focus) ---- */
function setLive(key, html){ const el = document.querySelector(`[data-live="${key}"]`); if (el) el.innerHTML = html; }
function updateLive(changedPath){
  const p = cur();
  const {res, W} = renderBadge();
  if (changedPath && changedPath==='p:nama') renderProgSelect();
  if (tab==='program'){
    setLive('rateInfo', rateInfo(p));
    res.ys.forEach(y=>setLive(`fac:${y}`, `× ${fmtNum(Math.pow(1+res.r, res.ref-y),4)}`));
  }
  if (tab==='outcome'){
    const fp = changedPath ? changedPath.split(':') : [];
    p.outcomes.forEach((o,i)=>{
      setLive(`oc:${o.id}`, ocLive(o,res));
      setLive(`octitle:${o.id}`, ocTitle(o,i));
      setLive(`ocw:${o.id}`, ocWarn(o,W));
      const card = document.querySelector(`[data-oc="${o.id}"]`);
      if (card){ card.classList.toggle('negatif', !!o.negatif); card.querySelector('.live').classList.toggle('negatif', !!o.negatif); }
      const r = res.rows.find(x=>x.o.id===o.id);
      res.ys.forEach(y=>{ const [n,pv] = ocYearCells(o,y,res); setLive(`oyn:${o.id}:${y}`, n); setLive(`oyp:${o.id}:${y}`, pv); });
      if (r){ setLive(`oyg:${o.id}`, fmtRp(r.gross)); setLive(`oyN:${o.id}`, fmtRp(r.net)); setLive(`oyP:${o.id}`, fmtRp(r.pv)); }
      if (fp[0]==='o' && fp[1]===o.id && fp[2]==='metode') setLive(`metdesc:${o.id}`, esc(metodeDesc(o.metode)));
    });
  }
  if (tab==='input') setLive('inpSum', inputSummary(p,res));
  if (tab==='sens'){ setLive('sensOut', sensOut()); setLive('scenRes', scenOut()); }
  if (tab==='toc') setLive('tocDiag', tocDiagram(p, true));
  if (tab==='selaras') setLive('sdgB', sdgBadges(p));
}
/* field yang mengubah susunan halaman → render ulang saat selesai diubah */
const RERENDER = /^(p:(tahunAwal|tahunAkhir|jenis)|o:[^:]+:kualitatif|s:[^:]+:material)$/;
function validateField(el){
  const path = el.dataset.path, f = fieldOf(path), box = el.closest('.f');
  if (!box || !NUM[f]) return;
  const c = checkNum(f, el.value);
  box.classList.toggle('bad', !!c.err);
  const m = box.querySelector('.msg'), h = box.querySelector('.hint');
  if (m) m.textContent = c.err || '';
  if (h) h.textContent = (!c.err && c.value!=null && NUM[f].money) ? '= ' + fmtRp(c.value) + (c.expr ? ' (hasil rumus)' : '') : '';
}

/* ================= Events ================= */
function onField(el){
  const path = el.dataset.path;
  const v = el.type==='checkbox' ? el.checked : el.value;
  setPath(path, v);
  validateField(el);
  save();
  updateLive(path);
  if (el.type==='checkbox' && path.startsWith('ck:')) {/* nothing */}
}
document.addEventListener('input', e=>{
  const el = e.target;
  if (el.dataset.path && el.type!=='checkbox' && el.tagName!=='SELECT') onField(el);
  if (el.dataset.scen){
    const k = el.dataset.scen; const v = parseFloat(el.value);
    if (k==='r') scen.r = v; else scen[k] = v;
    const lab = document.querySelector(`[data-live="scenv:${k}"]`); if (lab) lab.textContent = scenLabel(k);
    const r = document.querySelector('[data-live="scenRes"]'); if (r) r.innerHTML = scenOut();
  }
});
document.addEventListener('change', e=>{
  const el = e.target;
  if (el.dataset.path && (el.type==='checkbox' || el.tagName==='SELECT')) onField(el);
  if (el.dataset.path && RERENDER.test(el.dataset.path)){ const y = window.scrollY; render(); window.scrollTo(0,y); }
  if (el.id==='progSelect'){ db.activeId = el.value; resetScen(); save(true); render(); window.scrollTo(0,0); }
});
document.addEventListener('click', e=>{
  if (helpOpenBtn && !e.target.closest('#hpop') && !e.target.closest('[data-act="help"]')) closeHelp();
  const t = e.target.closest('[data-tab],[data-act]');
  if (!t) { const m = $('#fileMenu'); if (m && m.open && !e.target.closest('#fileMenu')) m.open = false; return; }
  if (t.dataset.tab && !t.dataset.act){
    tab = t.dataset.tab; render(); window.scrollTo(0,0);
    if (t.dataset.anchor){ const a = document.getElementById(t.dataset.anchor); if (a) setTimeout(()=>a.scrollIntoView({behavior:'smooth',block:'start'}),50); }
    if (t.dataset.focus){ const card = document.querySelector(`[data-oc="${t.dataset.focus}"]`); if (card){ card.scrollIntoView({behavior:'smooth',block:'start'}); card.style.outline='3px solid #f0c36d'; setTimeout(()=>card.style.outline='',1800); } }
    return;
  }
  const act = t.dataset.act, p = cur();
  const m = $('#fileMenu'); if (m && t.closest('#fileMenu .pop')) m.open = false;
  switch(act){
    case 'help': openHelp(t); break;
    case 'helpClose': closeHelp(); break;
    case 'helpInline': { const s = document.querySelector(`.help-inline[data-k="${t.dataset.k}"]`); if (s) s.hidden = !s.hidden; break; }
    case 'setv': {
      setPath(t.dataset.path, t.dataset.v);
      const inp = document.querySelector(`[data-path="${t.dataset.path}"]`);
      if (inp){ inp.value = t.dataset.v; validateField(inp); }
      save(); updateLive(t.dataset.path); break;
    }
    case 'addS': p.stakeholders.push(blankStk()); save(); render(); focusLast('s:'); break;
    case 'delS': {
      const s = findS(t.dataset.id); const used = p.outcomes.filter(o=>o.stakeholderId===t.dataset.id).length;
      if (!confirm(`Hapus stakeholder "${s&&s.nama||'(tanpa nama)'}"?${used?`\n${used} outcome memakai stakeholder ini dan akan jadi "belum dipilih".`:''}`)) break;
      p.stakeholders = p.stakeholders.filter(x=>x.id!==t.dataset.id);
      p.outcomes.forEach(o=>{ if (o.stakeholderId===t.dataset.id) o.stakeholderId=''; });
      p.inputs.forEach(i=>{ if (i.stakeholderId===t.dataset.id) i.stakeholderId=''; });
      save(); render(); break;
    }
    case 'addR': p.regulasi.push(blankReg()); save(); render(); focusLast('r:'); break;
    case 'delR': if (confirm('Hapus baris regulasi ini?')){ p.regulasi = p.regulasi.filter(x=>x.id!==t.dataset.id); save(); render(); } break;
    case 'addG': p.sdgs.push(blankSdg()); save(); render(); focusLast('g:'); break;
    case 'delG': if (confirm('Hapus baris SDGs ini?')){ p.sdgs = p.sdgs.filter(x=>x.id!==t.dataset.id); save(); render(); } break;
    case 'addU': { const u = blankUnit(); p.units.push(u); save(); render(); const f = document.querySelector(`[data-path="u:${u.id}:nama"]`); if (f){ f.scrollIntoView({behavior:'smooth',block:'center'}); setTimeout(()=>f.focus(),300); } break; }
    case 'delU': if (confirm('Hapus unit terkait ini?')){ p.units = p.units.filter(x=>x.id!==t.dataset.id); save(); render(); } break;
    case 'addI': { const last = p.inputs[p.inputs.length-1]; p.inputs.push(blankInput(last && last.tahun ? last.tahun : yearsOf(p)[0], last ? last.siteId : '')); save(); render(); focusLast('i:'); break; }
    case 'dupI': { const i = p.inputs.findIndex(x=>x.id===t.dataset.id); const c = Object.assign({}, p.inputs[i], {id:uid()}); p.inputs.splice(i+1,0,c); save(); render(); break; }
    case 'addSite': { p.sites.push({id:uid(), nama:''}); save(); render(); const els = $$('[data-path^="st:"]'); if (els.length) els[els.length-1].focus(); break; }
    case 'delSite': { const st = findSite(t.dataset.id); const used = p.inputs.filter(i=>i.siteId===t.dataset.id).length + p.outcomes.filter(o=>o.siteId===t.dataset.id).length;
      if (!confirm(`Hapus lokasi "${st&&st.nama||'(tanpa nama)'}"?${used?`\n${used} input/outcome memakai lokasi ini dan akan jadi "bersama / tidak spesifik".`:''}`)) break;
      p.sites = p.sites.filter(x=>x.id!==t.dataset.id); p.inputs.forEach(i=>{ if (i.siteId===t.dataset.id) i.siteId=''; }); p.outcomes.forEach(o=>{ if (o.siteId===t.dataset.id) o.siteId=''; }); save(); render(); break; }
    case 'rateSame': { const ys = yearsOf(p), r0 = (p.years[ys[0]]||{}).rate; if (isBlank(r0)){ toast('Isi rate tahun '+ys[0]+' dulu'); break; }
      ys.forEach(y=>{ p.years[y] = Object.assign({bulan:'12'}, p.years[y]||{}, {rate:r0}); }); save(); render(); toast('Rate semua tahun = '+r0+'%'); break; }
    case 'setRef': { const ys = yearsOf(p); p.tahunAcuan = String(t.dataset.v==='awal' ? ys[0] : ys[ys.length-1]); save(); render(); break; }
    case 'ocCopyVal': case 'ocCopyFil': case 'ocDropComp': {
      const o = p.outcomes.find(x=>x.id===t.dataset.id); if (!o) break;
      const ys = yearsOf(p); ys.forEach(y=>{ if (!o.years[y]) o.years[y] = {nilai:'', dw:'', attr:'', disp:'', drop:''}; });
      const filled = ys.filter(y=>!isBlank(o.years[y].nilai)); const y0 = filled[0];
      if (!y0){ toast('Isi nilai manfaat untuk satu tahun dulu'); break; }
      if (act==='ocCopyVal'){ ys.filter(y=>y>y0 && isBlank(o.years[y].nilai)).forEach(y=>{ o.years[y].nilai = o.years[y0].nilai; }); toast('Nilai tahun '+y0+' disalin ke tahun yang kosong'); }
      if (act==='ocCopyFil'){ ys.filter(y=>y!==y0).forEach(y=>['dw','attr','disp'].forEach(k=>{ o.years[y][k] = o.years[y0][k]; })); toast('DW, Attr, Disp disamakan dengan tahun '+y0); }
      if (act==='ocDropComp'){
        const inp = document.querySelector(`[data-dof="${o.id}"]`), x = inp ? val(inp.value, NaN) : NaN;
        if (!(x>=0 && x<=100)){ toast('Isi persen drop-off per tahun dulu, mis. 15'); break; }
        ys.filter(y=>y>=y0).forEach(y=>{ const k = y - y0; o.years[y].drop = numIn(Math.round((1-Math.pow(1-x/100,k))*1e4)/100); });
        toast(`Drop-off majemuk ${numIn(x)}% per tahun diterapkan`);
      }
      save(); const sy = window.scrollY; render(); window.scrollTo(0,sy); break; }
    case 'delI': if (confirm('Hapus baris input ini?')){ p.inputs = p.inputs.filter(x=>x.id!==t.dataset.id); save(); render(); } break;
    case 'addO': { const o = blankOutcome(p.stakeholders.length===1?p.stakeholders[0].id:''); p.outcomes.push(o); save(); render();
      const c = document.querySelector(`[data-oc="${o.id}"]`); if (c){ c.scrollIntoView({behavior:'smooth',block:'start'}); const f = c.querySelector('select,input'); if (f) setTimeout(()=>f.focus(),300); } break; }
    case 'delO': { const o = p.outcomes.find(x=>x.id===t.dataset.id); if (confirm(`Hapus outcome "${o&&o.outcome||'(belum dinamai)'}"?`)){ p.outcomes = p.outcomes.filter(x=>x.id!==t.dataset.id); save(); render(); } break; }
    case 'dupO': { const i = p.outcomes.findIndex(x=>x.id===t.dataset.id); const c = JSON.parse(JSON.stringify(p.outcomes[i])); c.id = uid(); c.outcome = (c.outcome||'') + ' (salinan)'; p.outcomes.splice(i+1,0,c); save(); render(); break; }
    case 'mvO': { const i = p.outcomes.findIndex(x=>x.id===t.dataset.id), j = i + (+t.dataset.d); if (j<0||j>=p.outcomes.length) break; [p.outcomes[i],p.outcomes[j]] = [p.outcomes[j],p.outcomes[i]]; save(); render(); break; }
    case 'togO': { const o = p.outcomes.find(x=>x.id===t.dataset.id); o.collapsed = !o.collapsed; save(); render(); break; }
    case 'collapseAll': p.outcomes.forEach(o=>o.collapsed = t.dataset.v==='1'); save(); render(); break;
    case 'scenReset': resetScen(); render(); break;
    case 'tocFill': {
      const merge = (k, items) => { const ex = lines(p.toc[k]); items.forEach(x=>{ x = String(x||'').trim(); if (x && !ex.includes(x)) ex.push(x); }); p.toc[k] = ex.join('\n'); };
      merge('input', p.inputs.map(i=>i.uraian + (valE(i.nilai,0)?` (${i.tahun?i.tahun+', ':''}${fmtRpShort(valE(i.nilai,0))})`:'')));
      merge('outcome', p.outcomes.map(o=>o.outcome + (o.negatif?' (negatif)':'')));
      save(); render(); toast('Diambil dari Input & Outcome'); break;
    }
    case 'newProg': { const n = prompt('Nama program baru:', 'Program baru'); if (n===null) break; const np = blankProgram(n.trim()||'Program baru'); db.programs[np.id] = np; db.activeId = np.id; tab='program'; resetScen(); save(true); render(); break; }
    case 'dupProg': { const c = migrate(JSON.parse(JSON.stringify(p))); c.id = uid(); c.nama = p.nama + ' (salinan)'; c.created = c.updated = new Date().toISOString(); db.programs[c.id] = c; db.activeId = c.id; save(true); render(); toast('Program diduplikat'); break; }
    case 'loadSample': { const s = sampleProgram(); db.programs[s.id] = s; db.activeId = s.id; tab='program'; resetScen(); save(true); render(); break; }
    case 'delProg': {
      if (!confirm(`Hapus program "${p.nama}" dari browser ini?\nSaran: simpan ke file dulu kalau masih perlu.`)) break;
      delete db.programs[p.id];
      if (!Object.keys(db.programs).length){ const np = blankProgram('Program baru'); db.programs[np.id] = np; }
      db.activeId = Object.keys(db.programs).sort((a,b)=>(db.programs[b].updated||'').localeCompare(db.programs[a].updated||''))[0];
      tab = 'program'; save(true); render(); break;
    }
    case 'saveFile': download(fileName(p.nama,'json'), JSON.stringify({app:'sroi-kalkulator', appVersion:APP_VERSION, schema:SCHEMA, exported:new Date().toISOString(), program:p}, null, 2), 'application/json'); dirty=false; break;
    case 'backupAll': download(`SROI_backup_semua_${today()}.json`, JSON.stringify({app:'sroi-kalkulator', appVersion:APP_VERSION, schema:SCHEMA, exported:new Date().toISOString(), programs:Object.values(db.programs)}, null, 2), 'application/json'); dirty=false; break;
    case 'openFile': $('#fileIn').value=''; $('#fileIn').click(); break;
    case 'exportCSV': exportCSV(); break;
    case 'print': tab='ringkasan'; render(); setTimeout(()=>window.print(), 120); break;
  }
});
function focusLast(prefix){ const els = $$(`[data-path^="${prefix}"]`); if (els.length){ const row = els[els.length-1].closest('tr'); const f = row && row.querySelector('input,textarea'); if (f) f.focus(); } }
function resetScen(){ scen = {dwAdd:0, attrAdd:0, dispAdd:0, dropAdd:0, proxyPct:0, r:null}; }

/* ================= Files ================= */
function fileName(name, ext){ return `SROI_${String(name||'program').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_').slice(0,60)||'program'}_${today()}.${ext}`; }
function download(name, text, mime){
  const blob = new Blob([text], {type: mime + ';charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('File diunduh: ' + name);
}
$('#fileIn').addEventListener('change', e=>{
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    let d; try{ d = JSON.parse(rd.result); }catch(err){ alert('File tidak bisa dibaca. Pastikan ini file .json dari Kalkulator SROI.'); return; }
    const list = d.programs ? d.programs : (d.program ? [d.program] : (d.outcomes ? [d] : null));
    if (!list || !list.length){ alert('File ini bukan file program Kalkulator SROI.'); return; }
    if (d.schema && d.schema > SCHEMA){ alert('File ini dibuat versi aplikasi yang lebih baru. Minta versi terbaru sroi-v2.html.'); return; }
    let lastId = null, n = 0;
    for (const raw of list){
      const p = migrate(raw);
      if (db.programs[p.id]){
        const keep = confirm(`Program "${p.nama}" sudah ada di browser ini.\n\nOK = timpa dengan isi file\nBatal = simpan sebagai salinan`);
        if (!keep){ p.id = uid(); p.nama = p.nama + ' (dari file)'; }
      }
      db.programs[p.id] = p; lastId = p.id; n++;
    }
    db.activeId = lastId; tab = 'hasil'; resetScen(); save(true); render();
    toast(n>1 ? `${n} program dibuka` : 'Program dibuka');
  };
  rd.readAsText(f);
});
function exportCSV(){
  const p = cur(), res = compute(p), ys = res.ys;
  const num = (v,d=2) => { const x = Math.round(v*Math.pow(10,d))/Math.pow(10,d); return String(x).replace('.',','); };
  const q = s => { s = String(s??''); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const head = ['No','Stakeholder','Jenis stakeholder','Lokasi','Outcome','Aspek','Indikator','Negatif','Kualitatif','Metode valuasi','Proxy & cara hitung','Sumber data & referensi'];
  ys.forEach(y=>head.push(`Nilai manfaat ${y} (Rp)`, `Rumus ${y}`, `DW ${y} %`, `Attr ${y} %`, `Disp ${y} %`, `DO ${y} %`, `Nilai bersih ${y} (Rp)`));
  head.push('Penjelasan deadweight','Penjelasan attribution','Penjelasan displacement','Penjelasan drop-off','Total nilai bersih (Rp)','Nilai saat ini (Rp)');
  const rows = [head];
  res.rows.forEach((r,i)=>{ const o = r.o, s = findS(o.stakeholderId), st = findSite(o.siteId);
    const row = [i+1, s?s.nama:'', s?optName(JENIS_STK,s.jenis):'', st?st.nama:'', o.outcome, optName(ASPEK,o.aspek), o.indikator, o.negatif?'Ya':'Tidak', o.kualitatif?'Ya':'Tidak', optName(METODE,o.metode), o.deskripsi, o.proxySumber];
    ys.forEach(y=>{ const t = r.years.find(x=>x.y===y), d = (o.years||{})[y]||{};
      if (!t || t.empty) row.push('', '', '', '', '', '', '');
      else row.push(num(Math.abs(t.gross),0), evalExpr(d.nilai).expr ? d.nilai : '', num(t.dw*100), num(t.at*100), num(t.di*100), num(t.dr*100), num(t.net,0)); });
    row.push(o.dwAlasan, o.attrAlasan, o.dispAlasan, o.dropAlasan, num(r.net,0), num(r.pv,0));
    rows.push(row);
  });
  rows.push([]);
  rows.push(['RINGKASAN PER TAHUN','Investasi (Rp)','Investasi saat ini (Rp)','Manfaat bersih (Rp)','Faktor','Manfaat saat ini (Rp)','SROI','Payback (bulan)','Bulan dihitung']);
  res.byYear.forEach(t=>rows.push([t.y, num(t.inp,0), num(t.inpPV,0), num(t.net,0), num(t.f,6), num(t.pv,0), t.sroi==null?'':num(t.sroi,4), t.payback==null?'':num(t.payback,2), num(t.bulan,0)]));
  rows.push(['Total', num(res.totalInput,0), num(res.totalInputPV,0), num(res.totalNet,0), '', num(res.totalPV,0), res.sroi==null?'':num(res.sroi,4), res.payback==null?'':num(res.payback,2), num(res.months,0)]);
  rows.push([]);
  rows.push(['Rate %', num(res.r*100,4)]);
  rows.push(['Tahun nilai saat ini', res.ref]);
  if (res.sroiNoPem!=null) rows.push(['SROI tanpa manfaat pemrakarsa', num(res.sroiNoPem,4)]);
  rows.push(['Fiksasi dampak %', num(res.fiksasi*100)]);
  rows.push([]);
  rows.push(['INPUT','Tahun','Lokasi','Uraian','Nilai (Rp)','Rumus','Sumber']);
  p.inputs.forEach((i,k)=>{ const st = findSite(i.siteId); rows.push([k+1, i.tahun, st?st.nama:'', i.uraian, num(Math.max(0,valE(i.nilai,0)),0), evalExpr(i.nilai).expr ? i.nilai : '', i.sumber]); });
  const reg = p.regulasi.filter(r=>!isBlank(r.nama)), sdg = p.sdgs.filter(g=>g.goal), un = p.units.filter(u=>!isBlank(u.nama));
  if (reg.length){ rows.push([]); rows.push(['REGULASI TERKAIT','Sifat','Pasal','Kaitan','Bukti']); reg.forEach(r=>rows.push([r.nama, optLabel(REG_SIFAT,r.sifat), r.pasal, r.kaitan, r.bukti])); }
  if (sdg.length){ rows.push([]); rows.push(['SDGs','Peran','Target','Outcome terkait','Kontribusi']); sdg.forEach(g=>{ const o = p.outcomes.find(x=>x.id===g.outcomeId); rows.push([sdgLabel(g.goal), g.peran==='utama'?'Utama':'Pendukung', g.target, o?o.outcome:'', g.kontribusi]); }); }
  if (un.length){ rows.push([]); rows.push(['UNIT TERKAIT','Jenis','Peran','Manfaat bagi unit/bisnis','Tingkat CSV','Indikator bisnis','PIC','Status']); un.forEach(u=>rows.push([u.nama, optLabel(UNIT_JENIS,u.jenis), u.peran, u.manfaat, u.csv?optLabel(csvOptions(),u.csv):'', u.indikator, u.pic, optLabel(UNIT_STATUS,u.status)])); }
  if (!isBlank(p.csvCatatan)){ rows.push([]); rows.push(['Ringkasan shared value', p.csvCatatan]); }
  if (p.isContoh) rows.push(['CONTOH - angka dummy']);
  const text = '﻿' + 'sep=;\r\n' + rows.map(r=>r.map(q).join(';')).join('\r\n');
  download(fileName(p.nama,'csv'), text, 'text/csv');
}

/* other tab / window edits */
window.addEventListener('storage', e=>{
  if (e.key!==LS_KEY || !e.newValue) return;
  try{ const d = JSON.parse(e.newValue); if (d && d.programs){ const keepActive = db.activeId; Object.keys(d.programs).forEach(k=>d.programs[k]=migrate(d.programs[k])); db = d; if (db.programs[keepActive]) db.activeId = keepActive; render(); toast('Diperbarui dari jendela lain'); } }catch(_){}
});
function flushSave(){ if (saveTimer){ clearTimeout(saveTimer); saveTimer = null; try{ localStorage.setItem(LS_KEY, JSON.stringify(db)); }catch(_){} } }
window.addEventListener('pagehide', flushSave);
window.addEventListener('beforeunload', flushSave);
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='hidden') flushSave(); });
document.addEventListener('toggle', e=>{
  const d = e.target; if (!d || !d.dataset || !d.dataset.howto) return;
  pref.open[d.dataset.howto] = d.open; savePref();
}, true);
window.addEventListener('beforeprint',()=>{ if (tab!=='ringkasan'){ tab='ringkasan'; render(); } });

/* ================= Boot ================= */
loadDB();
try{ localStorage.setItem(LS_KEY+'-test','1'); localStorage.removeItem(LS_KEY+'-test'); }catch(e){ storageOK = false; }
applyPref();
render();
if (importedV1) setTimeout(()=>toast(`${importedV1} program dari versi 1 dipindahkan ke versi 2. Hasil hitungnya sama.`), 300);
if (storageOK) save(true);
window.__sroi = {compute, parseNum, evalExpr, checkNum, analyze, breakEven, sensTests, migrate, get db(){return db;}, cur};
})();
