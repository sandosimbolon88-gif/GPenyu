/* ---- 4. Outcome ---- */
const metodeOptions = () => [['','— pilih metode valuasi —'], ...METODE.map(([k,n])=>[k,n])];
const metodeDesc = k => { const m = METODE.find(x=>x[0]===k); return m ? m[2] : ''; };
function ocTitle(o, idx){
  const s = findS(o.stakeholderId), st = findSite(o.siteId);
  const tags = [s ? s.nama : 'stakeholder belum dipilih', st ? st.nama : '', o.aspek ? optName(ASPEK,o.aspek) : ''].filter(Boolean).map(esc).join(' · ');
  return `<b>#${idx+1} · ${esc(o.outcome || 'Outcome belum dinamai')}</b><span class="small muted">${tags}${o.negatif?' · <span style="color:var(--neg)">outcome negatif</span>':''}${o.kualitatif?' · <i>kualitatif</i>':''}${isPem(o)?' · <span style="color:var(--info)">pemrakarsa</span>':''}</span>`;
}
function ocLive(o, res){
  if (o.kualitatif) return `<div class="flow"><span>Outcome kualitatif: dicatat di laporan, tidak dirupiahkan dan tidak ikut rasio.</span></div>`;
  if ((res.excluded||[]).includes(o)){ const s = findS(o.stakeholderId); return `<div class="flow"><span>Tidak masuk total: stakeholder <b>${esc(s?s.nama:'')}</b> ditandai <i>tidak dihitung</i> di ${tabRef('stakeholder')}.</span></div>`; }
  const r = res.rows.find(x=>x.o.id===o.id); if (!r) return '';
  const cut = r.gross!==0 ? 1 - r.net/r.gross : 0;
  return `<div class="flow">
      <span>Nilai kotor <b>${fmtRp(r.gross)}</b></span><span class="a">→ setelah fiksasi dampak →</span>
      <span><b>${fmtRp(r.net)}</b> (berkurang ${fmtPct(cut)})</span><span class="a">→</span>
      <span>Nilai saat ini <b>${fmtRp(r.pv)}</b></span>
      ${res.totalPV ? `<span class="muted">(${fmtPct(r.pv/res.totalPV)} dari total manfaat)</span>` : ''}
    </div>`;
}
function ocWarn(o, W){
  const ws = W.filter(w=>w.id===o.id && w.lvl!=='info');
  return ws.length ? `<ul class="wl">${ws.map(w=>`<li class="${w.lvl}">${w.lvl==='err'?'⛔':'⚠️'} ${esc(w.msg.replace(/^Outcome \d+( \([^)]*\))?[:,] ?/,''))}</li>`).join('')}</ul>` : '';
}
function ocYearCells(o, y, res){
  const r = res.rows.find(x=>x.o.id===o.id), t = r && r.years.find(x=>x.y===y);
  return t && !t.empty ? [fmtRp(t.net), fmtRp(t.pv)] : ['–','–'];
}
function ocYearTable(o, res){
  const ys = res.ys, r = res.rows.find(x=>x.o.id===o.id);
  const pc = (y,k,lab) => fld({label:`${lab} ${y}`, path:`oy:${o.id}:${y}:${k}`, type:'num', unit:'%'});
  return `<div class="tw"><table class="edit-table yt">
    <thead><tr><th>Tahun</th>${thQ('Nilai manfaat kotor (Rp)','nilaiY')}${thQ(filterLabel(cur(),'dw','Deadweight'),'dw')}${thQ(filterLabel(cur(),'attr','Attribution'),'attr')}${thQ(filterLabel(cur(),'disp','Displacement'),'disp')}${thQ(filterLabel(cur(),'drop','Drop-off'),'drop')}<th class="num">Nilai bersih</th><th class="num">Nilai saat ini</th></tr></thead>
    <tbody>${ys.map(y=>{ const [n,pv] = ocYearCells(o,y,res); return `<tr><td><b>${y}</b></td>
      <td style="min-width:230px">${fld({label:'Nilai manfaat '+y, path:`oy:${o.id}:${y}:nilai`, type:'num', ph:'mis. 750.000 × 40% × 25'})}</td>
      <td style="width:92px">${pc(y,'dw','Deadweight')}</td><td style="width:92px">${pc(y,'attr','Attribution')}</td><td style="width:92px">${pc(y,'disp','Displacement')}</td><td style="width:92px">${pc(y,'drop','Drop-off')}</td>
      <td class="num" data-live="oyn:${o.id}:${y}">${n}</td><td class="num" data-live="oyp:${o.id}:${y}">${pv}</td></tr>`; }).join('')}
    <tr class="tot"><td>Total</td><td class="num" data-live="oyg:${o.id}">${r?fmtRp(r.gross):'–'}</td><td colspan="4"></td><td class="num" data-live="oyN:${o.id}">${r?fmtRp(r.net):'–'}</td><td class="num" data-live="oyP:${o.id}">${r?fmtRp(r.pv):'–'}</td></tr></tbody>
  </table></div>
  <div class="row noprint" style="gap:6px;align-items:center;margin-top:6px">
    <button class="btn sm" data-act="ocCopyVal" data-id="${o.id}" title="Isi tahun yang masih kosong dengan nilai tahun pertama">Salin nilai tahun pertama</button>
    <button class="btn sm" data-act="ocCopyFil" data-id="${o.id}" title="Deadweight, attribution, displacement semua tahun = tahun pertama">Samakan DW/Attr/Disp</button>
    <span class="small">Drop-off majemuk <input type="text" inputmode="decimal" class="dof" data-dof="${o.id}" placeholder="15" aria-label="Drop-off per tahun dalam persen" style="width:56px;border:1px solid #cdd3cf;border-radius:6px;padding:3px 6px">% per tahun</span>
    <button class="btn sm" data-act="ocDropComp" data-id="${o.id}">Terapkan</button> ${qBtn('drop','Drop-off majemuk')}
  </div>`;
}
function ocValueSection(o, res){
  const p = cur(), us = tahapOf(p)==='usulan';
  const body = `${ocYearTable(o,res)}
        <div class="grid g2" style="margin-top:12px">
          ${FILTERS.map(F=>fld({label:`Penjelasan: ${filterLabel(p,F.k,F.lab).toLowerCase()}`, path:`o:${o.id}:${F.k}Alasan`, type:'textarea', rows:2, ph:F.q, help:F.k+'Alasan'})).join('')}
        </div>`;
  if (!us) return `<div class="sec"><h4>3. Nilai & fiksasi dampak per tahun</h4>${body}</div>`;
  const has = Object.values(o.years||{}).some(d=>!isBlank(d.nilai));
  return `<details class="sec secopt"${has?' open':''}><summary><h4>3. Perkiraan nilai (opsional di tahap usulan)</h4><span class="tiny muted">klik untuk ${has?'menutup':'mengisi'} · dipakai untuk perkiraan SROI</span></summary>${body}</details>`;
}
function ocCard(o, idx, res, W){

  return `<div class="card oc${o.negatif?' negatif':''}${o.kualitatif?' kual':''}${o.collapsed?' collapsed':''}" data-oc="${o.id}" data-item="${o.id}">

          ${fld({label:'Status bukti', path:`o:${o.id}:status`, type:'select', options:STATUS_O})}
          <div class="f"><label>Jenis outcome ${qBtn('jenisOutcome','Jenis outcome')}</label>
            <label class="chk" style="font-weight:400"><input type="checkbox" data-path="o:${o.id}:negatif" ${o.negatif?'checked':''}> Negatif (mengurangi nilai)</label>
            <label class="chk" style="font-weight:400"><input type="checkbox" data-path="o:${o.id}:kualitatif" ${o.kualitatif?'checked':''}> Kualitatif (tidak dirupiahkan)</label></div>

          ${fld({label:'Proxy & cara hitung', path:`o:${o.id}:deskripsi`, type:'textarea', rows:3, ph:'Proxy apa, harga satuan × faktor × jumlah'})}

function tOutcome(){
  const p = cur(), res = compute(p), W = analyze(p,res);
  return `${howTo('outcome')}<div class="card flat">
    <div class="row" style="align-items:center">

      <div class="row noprint" style="gap:6px">

/* ---- 5. Hasil ---- */
function warnList(W, linkTabs){
  if (!W.length) return `<p class="small muted">Tidak ada peringatan.</p>`;
  const order = {err:0,warn:1,info:2};
  return `<ul class="wl">${W.slice().sort((a,b)=>order[a.lvl]-order[b.lvl]).map(w=>`<li class="${w.lvl}">${w.lvl==='err'?'⛔':w.lvl==='warn'?'⚠️':'ℹ️'} <span>${esc(w.msg)}</span>${linkTabs?`<button class="btn sm go noprint" data-tab="${w.tab}" ${w.id?`data-focus="${w.id}"`:''}>Buka</button>`:''}</li>`).join('')}</ul>`;
}
function kpis(res){
  const nErr = analyze(cur(), res).filter(w=>w.lvl==='err').length;
  return `${nErr && res.sroi!=null ? `<div class="banner" style="padding:0;margin:0 0 10px"><div class="b-err"><b>Belum valid:</b> ada ${nErr} error (angka tidak valid atau data wajib kosong). Angka di bawah belum bisa dipakai sampai error diperbaiki.</div></div>` : ''}
  <div class="kpis">
    <div class="kpi big"><div class="l">${tahapOf(cur())==='usulan'?'Perkiraan rasio SROI':'Rasio SROI'} ${res.ys[0]}–${res.ys[res.ys.length-1]}</div><div class="v">1 : ${fmtRatio(res.sroi)}</div>
      <div class="tiny" style="opacity:.9">${res.sroi!=null?`Tiap Rp 1 investasi → nilai sosial sekitar Rp ${fmtNum(res.sroi,2)}`:'Isi input dan outcome dulu'}${res.sroiNoPem!=null?`<br>Tanpa manfaat pemrakarsa: 1 : ${fmtRatio(res.sroiNoPem)}`:''}</div></div>
    <div class="kpi"><div class="l">Nilai manfaat saat ini</div><div class="v">${fmtRpShort(res.totalPV)}</div><div class="tiny muted">${fmtRp(res.totalPV)}</div></div>
    <div class="kpi"><div class="l">Investasi saat ini</div><div class="v">${fmtRpShort(res.totalInputPV)}</div><div class="tiny muted">nominal ${fmtRp(res.totalInput)}</div></div>
    <div class="kpi"><div class="l">Nilai bersih (NPV)</div><div class="v" style="color:${res.npv<0?'var(--neg)':'inherit'}">${fmtRpShort(res.npv)}</div><div class="tiny muted">manfaat − investasi (nilai saat ini)</div></div>
    <div class="kpi"><div class="l">Payback period</div><div class="v">${fmtBln(res.payback)}</div><div class="tiny muted">dari ${fmtNum(res.months)} bulan periode</div></div>
    <div class="kpi"><div class="l">Fiksasi dampak</div><div class="v">${fmtPct(res.fiksasi)}</div><div class="tiny muted">nilai kotor yang dikurangi DW, Attr, Disp, DO</div></div>
  </div>
  <div class="tiny muted" style="margin-top:6px">Rate ${fmtRate(res.r)} · nilai saat ini di tahun ${res.ref}</div>`;
}
function yearTable(res){
  if (!res.byYear.length) return '';

  return `<div class="tw"><table>
    <thead><tr><th>Tahun</th><th class="num">Investasi</th><th class="num">Investasi saat ini</th><th class="num">Manfaat kotor</th><th class="num">Manfaat bersih</th><th class="num">Faktor</th><th class="num">Manfaat saat ini</th><th class="num">SROI</th><th class="num">Payback</th></tr></thead>
    <tbody>${res.byYear.map(t=>`<tr><td>${t.y} <span class="tiny muted">(${fmtNum(t.bulan)} bln)</span></td><td class="num">${fmtRp(t.inp)}</td><td class="num">${fmtRp(t.inpPV)}</td><td class="num">${fmtRp(t.gross)}</td><td class="num">${fmtRp(t.net)}</td><td class="num">× ${fmtNum(t.f,4)}</td><td class="num">${fmtRp(t.pv)}</td><td class="num"><b>${t.inpPV>0?'1 : '+fmtRatio(t.sroi):'–'}</b></td><td class="num">${fmtBln(t.payback)}</td></tr>`).join('')}
    <tr class="tot"><td>Total</td><td class="num">${fmtRp(res.totalInput)}</td><td class="num">${fmtRp(res.totalInputPV)}</td><td class="num">${fmtRp(res.totalGross)}</td><td class="num">${fmtRp(res.totalNet)}</td><td></td><td class="num">${fmtRp(res.totalPV)}</td><td class="num">1 : ${fmtRatio(tot.sroi)}</td><td class="num">${fmtBln(tot.payback)}</td></tr></tbody>
  </table></div>
  <div class="tiny muted">SROI per tahun = manfaat saat ini tahun itu ÷ investasi saat ini tahun itu. Tahun tanpa investasi tidak punya rasio sendiri, tapi manfaatnya tetap masuk total.</div>`;
}
function siteTable(p){
  if (!p.sites.length) return '';
  const groups = [...p.sites.map(s=>[s.id, s.nama||'(tanpa nama)']), ['', 'Bersama / tidak spesifik']];

/* ---- 6. Sensitivitas ---- */
function sensTests(p){
  const base = compute(p).sroi;
  const S = p.sens; const g = k => Math.max(0, val(S[k],0));
  const t1 = x => fmtNum(x,1).replace(/,0$/,'');
  const tests = [
    ['Deadweight', `±${t1(g('dwPP'))} poin %`, {dwAdd:-g('dwPP')}, {dwAdd:g('dwPP')}],
    ['Attribution', `±${t1(g('attrPP'))} poin %`, {attrAdd:-g('attrPP')}, {attrAdd:g('attrPP')}],
    ['Displacement', `±${t1(g('dispPP'))} poin %`, {dispAdd:-g('dispPP')}, {dispAdd:g('dispPP')}],
    ['Drop-off', `±${t1(g('dropPP'))} poin %`, {dropAdd:-g('dropPP')}, {dropAdd:g('dropPP')}],
    ['Nilai manfaat (proxy)', `±${t1(g('proxyPct'))}%`, {proxyPct:-g('proxyPct')}, {proxyPct:g('proxyPct')}],
    ['Rate', `${t1(g('drLow'))}% s/d ${t1(g('drHigh'))}%`, {r:g('drLow')}, {r:g('drHigh')}]
  ].map(([n,desc,a,b])=>{ const A = compute(p,a).sroi, B = compute(p,b).sroi; return {n,desc,lo:Math.min(A,B),hi:Math.max(A,B),A,B}; });
  return {base, tests, noPem: compute(p).sroiNoPem};
}
function breakEven(p){
  const base = compute(p).sroi; if (base==null) return [];
  const f = ov => compute(p, ov).sroi;
  const out = [];
  const add = (n, x, txt) => out.push({n, txt: x==null ? 'Tidak tercapai dalam rentang wajar' : txt(x)});
  add('Semua deadweight ditambah', solveOne(x=>f({dwAdd:x}),-100,100), x=>`${x>=0?'+':''}${fmtNum(x,1)} poin %`);
  add('Semua attribution ditambah', solveOne(x=>f({attrAdd:x}),-100,100), x=>`${x>=0?'+':''}${fmtNum(x,1)} poin %`);
  add('Semua drop-off ditambah', solveOne(x=>f({dropAdd:x}),-100,100), x=>`${x>=0?'+':''}${fmtNum(x,1)} poin %`);
  add('Semua nilai manfaat diubah', solveOne(x=>f({proxyPct:x}),-100,2000), x=>`${x>=0?'+':''}${fmtNum(x,1)}%`);
  return out;
}
function tornado(st){
  const vals = st.tests.flatMap(t=>[t.lo,t.hi]).concat([st.base,1]).filter(v=>v!=null&&isFinite(v));
  if (!vals.length) return '';
  let mn = Math.min(...vals), mx = Math.max(...vals); if (mx-mn<1e-9){ mx+=0.5; mn-=0.5; }
  const pad = (mx-mn)*0.06; mn-=pad; mx+=pad;
  const X = v => ((v-mn)/(mx-mn)*100).toFixed(2);
  const sorted = st.tests.slice().sort((a,b)=>(b.hi-b.lo)-(a.hi-a.lo));
  return `<div class="bars tor">${sorted.map(t=>`<div class="b"><div>${t.n} <span class="tiny muted">${t.desc}</span></div>
    <div class="track"><div class="rng" style="left:${X(t.lo)}%;width:${(X(t.hi)-X(t.lo)).toFixed(2)}%"></div><div class="base" style="left:${X(st.base)}%"></div>${mn<1&&mx>1?`<div class="one" style="left:${X(1)}%"></div>`:''}</div>
    <div class="num">${fmtRatio(t.lo)} – ${fmtRatio(t.hi)}</div></div>`).join('')}</div>
    <div class="tiny muted">Garis hitam = rasio dasar (${fmtRatio(st.base)}). ${mn<1&&mx>1?'Garis putus merah = titik impas 1 : 1.':''} Diurutkan dari yang paling berpengaruh.</div>`;
}
function sensOut(){
  const p = cur(), st = sensTests(p), be = breakEven(p);

  return `<div class="card"><h2>Uji satu per satu</h2>

      ${tornado(st)}

      ${st.noPem!=null?`<tr><td>Tanpa manfaat pemrakarsa</td><td>outcome stakeholder jenis pemrakarsa dikeluarkan</td><td class="num" colspan="2">${fmtRatio(st.noPem)}</td></tr>`:''}</tbody></table></div>

    </div>
    ${ex?`<div class="card"><h2>Kalau satu outcome dikeluarkan</h2><p class="small muted">Berguna untuk melihat apakah rasio bergantung pada satu outcome saja.</p>
      <div class="tw"><table><thead><tr><th>Outcome yang dikeluarkan</th><th class="num">SROI tanpa outcome ini</th></tr></thead><tbody>${ex}</tbody></table></div></div>`:''}`;

/* ---- Cek kualitas Theory of Change ---- */
const OUTPUT_LIKE = /\b(dilatih|mengikuti|hadir|terlaksana|diadakan|dibagikan|disalurkan|diselenggarakan|menerima bantuan|diberikan)\b/i;
function tocChecks(p, add){
  const all = nodesOf(p), items = p.toc.items;
  if (isBlank(p.toc.masalah)) add('info','toc','Theory of Change: masalah/konteks belum diisi.');
  if (!items.length && !p.outcomes.length){ add('info','toc','Theory of Change belum diisi. Coba "Susun dengan panduan" atau pakai template.'); return; }
  const incoming = new Set(); all.forEach(n=>validTo(p,n,all).forEach(t=>incoming.add(t)));
  const has = col => all.some(n=>n.col===col);
  all.forEach(n=>{ const nm = `"${short(n.text||'(kosong)',45)}"`;
    if (isBlank(n.text)) return;
    if (['kegiatan','output','outcomePendek'].includes(n.col) && !validTo(p,n,all).length) add('info','toc',`${colName(n.col)} ${nm} belum mengarah ke kotak mana pun.`);
    if (n.col==='outcome' && n.kind==='card' && !n.ref.negatif && !isPem(n.ref, p) && (has('kegiatan')||has('output')||has('outcomePendek')) && !incoming.has(n.id)) add('info','toc',`Outcome ${nm} belum punya kotak yang mengarah ke sana.`);
    if (n.col==='outcome' && !(n.kind==='card' && (n.ref.negatif || isPem(n.ref,p))) && has('impact') && !validTo(p,n,all).length) add('info','toc',`Outcome ${nm} belum dihubungkan ke impact.`);
    if (['outcomePendek','outcome','impact'].includes(n.col) && OUTPUT_LIKE.test(n.text)) add('warn','toc',`${colName(n.col)} ${nm} terdengar seperti output (kegiatan terjadi), bukan perubahan yang dialami stakeholder.`);
    if (n.col==='outcome' && n.kind==='item') add('info','toc',`Outcome ${nm} baru ada di Theory of Change. Klik ✎ → "Jadikan kartu outcome" kalau ingin menilainya.`);
  });
  if (!has('impact')) add('info','toc','Kolom Impact masih kosong.');
}

/* ---- 7. ToC ----
   Kotak ToC tersimpan di p.toc.items ({id, col, text, to:[id], indikator}).
   Kolom "Outcome jangka menengah" = kartu outcome (satu sumber) + kotak ToC tambahan yang belum punya kartu. */
const TOC_COLS = [
  ['input','Input','sumber daya','tocInput'],['kegiatan','Kegiatan','yang dikerjakan','tocKegiatan'],['output','Output','hasil langsung','tocOutput'],
  ['outcomePendek','Outcome jangka pendek','pengetahuan, sikap, akses','tocPendek'],['outcome','Outcome jangka menengah','perilaku, kondisi','tocMenengah'],['impact','Impact','jangka panjang','tocImpact']
];
const COL_IX = Object.fromEntries(TOC_COLS.map(([k],i)=>[k,i]));
const colName = k => (TOC_COLS.find(x=>x[0]===k)||[,''])[1];
const lines = s => String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
const sdgLabel = g => g && SDGS[+g-1] ? `SDG ${g} · ${SDGS[+g-1]}` : '';
function sdgBadges(p){
  const list = p.sdgs.filter(g=>g.goal).slice().sort((a,b)=>(a.peran==='utama'?0:1)-(b.peran==='utama'?0:1) || (+a.goal)-(+b.goal));
  const seen = new Set();
  return list.filter(g=>{ const k = g.goal+'|'+g.peran; if (seen.has(k)) return false; seen.add(k); return true; })
    .map(g=>`<span class="sdgb${g.peran==='utama'?' utama':''}" title="${g.peran==='utama'?'Tujuan utama':'Tujuan pendukung'}">${esc(sdgLabel(g.goal))}</span>`).join('');
}
/* Semua simpul ToC, urut per kolom */
function nodesOf(p){
  const out = [];
  TOC_COLS.forEach(([col])=>{
    if (col==='outcome') p.outcomes.forEach(o=>out.push({id:o.id, col, kind:'card', text:o.outcome||'', to:o.tocTo, indikator:o.indikator, ref:o}));
    p.toc.items.filter(x=>x.col===col).forEach(x=>out.push({id:x.id, col, kind:'item', text:x.text, to:x.to, indikator:x.indikator, ref:x}));
  });
  return out;
}
const nodeById = (p, id) => nodesOf(p).find(n=>n.id===id);
function validTo(p, n, all){ all = all || nodesOf(p); return (n.to||[]).filter(t=>{ const m = all.find(x=>x.id===t); return m && COL_IX[m.col] > COL_IX[n.col]; }); }
function pruneLinks(p){ const all = nodesOf(p); all.forEach(n=>{ const v = validTo(p, n, all); n.to.splice(0, n.to.length, ...v); }); }
function tocBox(p, n, ed, all){
  const tos = validTo(p, n, all).map(t=>all.find(x=>x.id===t)).filter(Boolean);
  let tag = '';
  if (n.kind==='card'){ const o = n.ref; const valued = !o.kualitatif && Object.values(o.years||{}).some(d=>!isBlank(d.nilai));
    tag = o.negatif ? '<span class="tm tm-neg">negatif</span>' : o.kualitatif ? '<span class="tm">kualitatif</span>' : valued ? '<span class="tm tm-ok">dirupiahkan</span>' : '<span class="tm">kartu outcome</span>'; }
  else if (n.col==='outcome') tag = '<span class="tm tm-warn">belum ada kartu</span>';
  return `<div class="it${n.kind==='card'?' card-node':''}" data-item="${n.id}" data-node="${n.id}" data-kind="${n.kind}">
    ${ed ? grip(n.text) : ''}<span class="it-t">${n.text ? esc(n.text) : '<i class="muted">(kosong)</i>'} ${tag}</span>

function drawArrows(){
  document.querySelectorAll('[data-toc][data-arrows]').forEach(w=>{
    const svg = w.querySelector('svg.toc-arrows'), cols = w.querySelectorAll('.toc > .col');
    const horizontal = cols.length>1 && Math.abs(cols[0].getBoundingClientRect().top - cols[1].getBoundingClientRect().top) < 4;
    w.classList.toggle('has-arrows', horizontal);
    if (!svg) return;
    if (!horizontal){ svg.innerHTML = ''; return; }
    const wr = w.getBoundingClientRect(), p = cur(), all = nodesOf(p), paths = [];
    svg.setAttribute('width', wr.width); svg.setAttribute('height', wr.height); svg.setAttribute('viewBox', `0 0 ${wr.width} ${wr.height}`);
    all.forEach(n=>validTo(p,n,all).forEach(tid=>{
      const a = w.querySelector(`[data-node="${n.id}"]`), b = w.querySelector(`[data-node="${tid}"]`); if (!a || !b) return;
      const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
      const x1 = ra.right - wr.left, y1 = ra.top + ra.height/2 - wr.top, x2 = rb.left - wr.left - 3, y2 = rb.top + rb.height/2 - wr.top, dx = Math.max(16, (x2-x1)/2);
      paths.push(`<path data-from="${n.id}" data-to="${tid}" d="M${x1.toFixed(1)},${y1.toFixed(1)} C${(x1+dx).toFixed(1)},${y1.toFixed(1)} ${(x2-dx).toFixed(1)},${y2.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}" marker-end="url(#tocah)"/>`);
    }));
    svg.innerHTML = `<defs><marker id="tocah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7d8f88"/></marker></defs>${paths.join('')}`;
  });
}

});

function tocQuality(p){

}
/* Ganti isi satu kolom dari daftar baris (dipakai panduan langkah demi langkah) */
function setColLines(p, col, arr){
  const old = p.toc.items.filter(x=>x.col===col), used = new Set(), keep = [];
  arr.forEach(t=>{ const m = old.find(x=>x.text===t && !used.has(x.id)); if (m){ used.add(m.id); keep.push(m); } else keep.push(blankTi(col, t)); });
  p.toc.items = p.toc.items.filter(x=>x.col!==col).concat(keep);
  pruneLinks(p);
}

function applyTemplate(p, key){
  const T = TOC_TEMPLATES.find(x=>x.k===key); if (!T) return;
  const byCol = {};
  TOC_COLS.forEach(([col])=>{ byCol[col] = (T[col]||[]).map(s=>{ const [text, links] = s.split('>'); return {ti: blankTi(col, text.trim()), links: links ? links.split(',').map(Number) : []}; }); });
  TOC_COLS.forEach(([col], i)=>{ const next = TOC_COLS[i+1]; if (!next) return;
    byCol[col].forEach(x=>x.links.forEach(j=>{ const t = byCol[next[0]][j]; if (t) x.ti.to.push(t.ti.id); })); });
  p.toc.items = TOC_COLS.flatMap(([col])=>byCol[col].map(x=>x.ti));
  p.outcomes.forEach(o=>{ o.tocTo = []; });
  Object.assign(p.toc, {masalah:T.masalah, sasaran:T.sasaran, asumsi:T.asumsi, risiko:T.risiko});
}

  return `<p class="small">Outcome #1 program CONTOH (penghasilan tambahan ibu, Desa Sukamaju), periode ${r.ys[0]}–${r.ys[r.ys.length-1]}:</p>
  <ol class="small">
    <li>Nilai kotor ${a.y} = 25 × Rp 300.000 × 12 bulan = ${fmtRp(a.gross)}. Nilai bersih = ${fmtRp(a.gross)} × (1 − ${pc(a.dw)}) × (1 − ${pc(a.at)}) × (1 − ${pc(a.di)}) × (1 − ${pc(a.dr)}) = <b>${fmtRp(a.net)}</b>.</li>
    <li>Nilai kotor ${b.y} = 25 × Rp 300.000 × 11 bulan = ${fmtRp(b.gross)}, dengan drop-off ${pc(b.dr)} → nilai bersih <b>${fmtRp(b.net)}</b>.</li>
    <li>Rate = rata-rata BI Rate ${r.ys.join(' dan ')} = ${rr}. Nilai saat ini (tahun ${r.ref}) = ${fmtRp(a.net)} × (1 + ${rr})¹ + ${fmtRp(b.net)} × (1 + ${rr})⁰ = <b>${fmtRp(o.pv)}</b>.</li>
    <li>Semua outcome dijumlahkan → ${fmtRp(r.totalPV)}. Investasi saat ini ${fmtRp(r.totalInputPV)}. SROI = <b>1 : ${fmtRatio(r.sroi)}</b>${r.sroiNoPem!=null?` (tanpa PR value pemrakarsa 1 : ${fmtRatio(r.sroiNoPem)})`:''}. Payback = ${fmtRp(r.totalInputPV)} ÷ (${fmtRp(r.totalPV)} ÷ ${fmtNum(r.months)} bulan) = ${fmtBln(r.payback)}.</li>
  </ol>`;
}

/* ---- Live updates without re-render (keeps focus) ---- */
function setLive(key, html){ const el = document.querySelector(`[data-live="${key}"]`); if (el) el.innerHTML = html; }
function updateLive(changedPath){
  const p = cur();
  const {res, W} = renderBadge();
  if (changedPath && changedPath==='p:nama') renderProgSelect();
  if (tab==='program'){
    setLive('rateInfo', rateInfo(p));
    res.ys.forEach(y=>setLive(`fac:${y}`, `× ${fmtNum(Math.pow(1+res.r, res.ref-y),4)}`));
  }
  if (tab==='outcome'){
    const fp = changedPath ? changedPath.split(':') : [];
    p.outcomes.forEach((o,i)=>{
      setLive(`oc:${o.id}`, ocLive(o,res));
      setLive(`octitle:${o.id}`, ocTitle(o,i));
      setLive(`ocw:${o.id}`, ocWarn(o,W));
      const card = document.querySelector(`[data-oc="${o.id}"]`);
      if (card){ card.classList.toggle('negatif', !!o.negatif); card.querySelector('.live').classList.toggle('negatif', !!o.negatif); }
      const r = res.rows.find(x=>x.o.id===o.id);
      res.ys.forEach(y=>{ const [n,pv] = ocYearCells(o,y,res); setLive(`oyn:${o.id}:${y}`, n); setLive(`oyp:${o.id}:${y}`, pv); });
      if (r){ setLive(`oyg:${o.id}`, fmtRp(r.gross)); setLive(`oyN:${o.id}`, fmtRp(r.net)); setLive(`oyP:${o.id}`, fmtRp(r.pv)); }
      if (fp[0]==='o' && fp[1]===o.id && fp[2]==='metode') setLive(`metdesc:${o.id}`, esc(metodeDesc(o.metode)));
    });
  }
  if (tab==='input') setLive('inpSum', inputSummary(p,res));
  if (tab==='sens'){ setLive('sensOut', sensOut()); setLive('scenRes', scenOut()); }
  if (tab==='laporan'){ const rb = document.querySelector('.report'); if (rb) rb.innerHTML = reportHTML(p); }

const RERENDER = /^(p:(tahunAwal|tahunAkhir|jenis)|o:[^:]+:kualitatif|s:[^:]+:material)$/;
function validateField(el){
  const path = el.dataset.path, f = fieldOf(path), box = el.closest('.f');
  if (!box || !NUM[f]) return;
  const c = checkNum(f, el.value);
  box.classList.toggle('bad', !!c.err);
  const m = box.querySelector('.msg'), h = box.querySelector('.hint');
  if (m) m.textContent = c.err || '';
  if (h) h.textContent = (!c.err && c.value!=null && NUM[f].money) ? '= ' + fmtRp(c.value) + (c.expr ? ' (hasil rumus)' : '') : '';
}

function focusLast(prefix){ const els = $$(`[data-path^="${prefix}"]`); if (els.length){ const row = els[els.length-1].closest('tr'); const f = row && row.querySelector('input,textarea'); if (f) f.focus(); } }
function resetScen(){ scen = {dwAdd:0, attrAdd:0, dispAdd:0, dropAdd:0, proxyPct:0, r:null}; }

/* ================= Files ================= */
function fileName(name, ext){ return `SROI_${String(name||'program').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_').slice(0,60)||'program'}_${today()}.${ext}`; }
function download(name, text, mime){
  const blob = new Blob([text], {type: mime + ';charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('File diunduh: ' + name);
}
$('#fileIn').addEventListener('change', e=>{
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    let d; try{ d = JSON.parse(rd.result); }catch(err){ alert('File tidak bisa dibaca. Pastikan ini file .json dari Kalkulator SROI.'); return; }
    const list = d.programs ? d.programs : (d.program ? [d.program] : (d.outcomes ? [d] : null));
    if (!list || !list.length){ alert('File ini bukan file program Kalkulator SROI.'); return; }
    if (d.schema && d.schema > SCHEMA){ alert('File ini dibuat versi aplikasi yang lebih baru. Minta versi terbaru sroi-v2.html.'); return; }
    let lastId = null, n = 0;
    for (const raw of list){
      const p = migrate(raw);
      if (db.programs[p.id]){
        const keep = confirm(`Program "${p.nama}" sudah ada di browser ini.\n\nOK = timpa dengan isi file\nBatal = simpan sebagai salinan`);
        if (!keep){ p.id = uid(); p.nama = p.nama + ' (dari file)'; }
      }
      db.programs[p.id] = p; lastId = p.id; n++;
    }
    db.activeId = lastId; tab = 'hasil'; resetScen(); save(true); render();
    toast(n>1 ? `${n} program dibuka` : 'Program dibuka');
  };
  rd.readAsText(f);
});
function exportCSV(){

  const q = s => { s = String(s??''); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const head = ['No','Stakeholder','Jenis stakeholder','Lokasi','Outcome','Aspek','Indikator','Baseline','Target','Realisasi','Status bukti','Negatif','Kualitatif','Metode valuasi','Proxy & cara hitung','Sumber data & referensi'];
  ys.forEach(y=>head.push(`Nilai manfaat ${y} (Rp)`, `Rumus ${y}`, `DW ${y} %`, `Attr ${y} %`, `Disp ${y} %`, `DO ${y} %`, `Nilai bersih ${y} (Rp)`));

    const row = [i+1, s?s.nama:'', s?optName(JENIS_STK,s.jenis):'', st?st.nama:'', o.outcome, optName(ASPEK,o.aspek), o.indikator, o.baseline, o.target, o.realisasi, optName(STATUS_O,o.status), o.negatif?'Ya':'Tidak', o.kualitatif?'Ya':'Tidak', optName(METODE,o.metode), o.deskripsi, o.proxySumber];
    ys.forEach(y=>{ const t = r.years.find(x=>x.y===y), d = (o.years||{})[y]||{};
      if (!t || t.empty) row.push('', '', '', '', '', '', '');

    row.push(o.dwAlasan, o.attrAlasan, o.dispAlasan, o.dropAlasan, num(r.net,0), num(r.pv,0));
    rows.push(row);
  });
  rows.push([]);
  rows.push(['RINGKASAN PER TAHUN','Investasi (Rp)','Investasi saat ini (Rp)','Manfaat bersih (Rp)','Faktor','Manfaat saat ini (Rp)','SROI','Payback (bulan)','Bulan dihitung']);
  res.byYear.forEach(t=>rows.push([t.y, num(t.inp,0), num(t.inpPV,0), num(t.net,0), num(t.f,6), num(t.pv,0), t.sroi==null?'':num(t.sroi,4), t.payback==null?'':num(t.payback,2), num(t.bulan,0)]));
  rows.push(['Total', num(res.totalInput,0), num(res.totalInputPV,0), num(res.totalNet,0), '', num(res.totalPV,0), res.sroi==null?'':num(res.sroi,4), res.payback==null?'':num(res.payback,2), num(res.months,0)]);
  rows.push([]);
  rows.push(['Rate %', num(res.r*100,4)]);
  rows.push(['Tahun nilai saat ini', res.ref]);
  if (res.sroiNoPem!=null) rows.push(['SROI tanpa manfaat pemrakarsa', num(res.sroiNoPem,4)]);
  rows.push(['Fiksasi dampak %', num(res.fiksasi*100)]);
  rows.push([]);
  rows.push(['INPUT','Tahun','Lokasi','Uraian','Nilai (Rp)','Rumus','Sumber']);
  p.inputs.forEach((i,k)=>{ const st = findSite(i.siteId); rows.push([k+1, i.tahun, st?st.nama:'', i.uraian, num(Math.max(0,valE(i.nilai,0)),0), evalExpr(i.nilai).expr ? i.nilai : '', i.sumber]); });
  const reg = p.regulasi.filter(r=>!isBlank(r.nama)), sdg = p.sdgs.filter(g=>g.goal), un = p.units.filter(u=>!isBlank(u.nama));
  if (reg.length){ rows.push([]); rows.push(['REGULASI TERKAIT','Sifat','Pasal','Kaitan','Bukti']); reg.forEach(r=>rows.push([r.nama, optLabel(REG_SIFAT,r.sifat), r.pasal, r.kaitan, r.bukti])); }
  if (sdg.length){ rows.push([]); rows.push(['SDGs','Peran','Target','Outcome terkait','Kontribusi']); sdg.forEach(g=>{ const o = p.outcomes.find(x=>x.id===g.outcomeId); rows.push([sdgLabel(g.goal), g.peran==='utama'?'Utama':'Pendukung', g.target, o?o.outcome:'', g.kontribusi]); }); }
  if (un.length){ rows.push([]); rows.push(['UNIT TERKAIT','Jenis','Peran','Manfaat bagi unit/bisnis','Tingkat CSV','Indikator bisnis','PIC','Status']); un.forEach(u=>rows.push([u.nama, optLabel(UNIT_JENIS,u.jenis), u.peran, u.manfaat, u.csv?optLabel(csvOptions(),u.csv):'', u.indikator, u.pic, optLabel(UNIT_STATUS,u.status)])); }
  if (!isBlank(p.csvCatatan)){ rows.push([]); rows.push(['Ringkasan shared value', p.csvCatatan]); }
  if (p.isContoh) rows.push(['CONTOH - angka dummy']);
  const text = '﻿' + 'sep=;\r\n' + rows.map(r=>r.map(q).join(';')).join('\r\n');
  download(fileName(p.nama,'csv'), text, 'text/csv');
}

/* other tab / window edits */
window.addEventListener('storage', e=>{
  if (e.key!==LS_KEY || !e.newValue) return;
  try{ const d = JSON.parse(e.newValue); if (d && d.programs){ const keepActive = db.activeId; Object.keys(d.programs).forEach(k=>d.programs[k]=migrate(d.programs[k])); db = d; if (db.programs[keepActive]) db.activeId = keepActive; render(); toast('Diperbarui dari jendela lain'); } }catch(_){}
});
function flushSave(){ if (saveTimer){ clearTimeout(saveTimer); saveTimer = null; try{ localStorage.setItem(LS_KEY, JSON.stringify(db)); }catch(_){} } }
window.addEventListener('pagehide', flushSave);
window.addEventListener('beforeunload', flushSave);
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='hidden') flushSave(); });
document.addEventListener('toggle', e=>{
  const d = e.target; if (!d || !d.dataset || !d.dataset.howto) return;
  pref.open[d.dataset.howto] = d.open; savePref();
}, true);
window.addEventListener('beforeprint',()=>{ if (tab!=='laporan'){ tab='laporan'; render(); } });

/* ================= Boot ================= */
loadDB();
try{ localStorage.setItem(LS_KEY+'-test','1'); localStorage.removeItem(LS_KEY+'-test'); }catch(e){ storageOK = false; }
applyPref();
render();
if (importedV1) setTimeout(()=>toast(`${importedV1} program dari versi 1 dipindahkan ke versi 2. Hasil hitungnya sama.`), 300);
if (storageOK) save(true);
window.__sroi = {compute, parseNum, evalExpr, checkNum, analyze, breakEven, sensTests, migrate, get db(){return db;}, cur};
})();
</script>
